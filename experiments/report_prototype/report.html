<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D · Report</title>
<style>
:root {
  --page: #ffffff; --surface: #ffffff; --ink: #0a0a0a; --ink-2: #666666; --muted: #8f8f8f;
  --grid: #f0f0f0; --axis: #e5e5e5; --line: #ebebeb; --wash: #f6f7f9; --bar: #e8f0fb; --bar-on: #cfe0f7;
  /* One hue, one meaning. Jobs: blue, orange, aqua, yellow. Stages: violet, magenta.
     Green = winning/good, red = losing/bad (heatmap, checks). Everything else is neutral ink. */
  --r1: #2a78d6; --r2: #eb6834; --r3: #1baf7a; --r4: #eda100;
  --link: #0a0a0a;
  --good: #0ca30c; --warn: #b77900; --bad: #d03b3b;
  --t-learn: #6250d6; --t-collect: #e87ba4; --t-export: #898781; --t-other: #e1e0d9; --t-setup: #b8b7b0; --t-eval: #898781; --t-run: #52514e; --t-stage: #898781; --t-wait: #b8b7b0;
  --div-mid: #f0efec; --div-pos: #0a7a35; --div-neg: #b4302f;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0a0a0a; --surface: #0a0a0a; --ink: #ededed; --ink-2: #a1a1a1; --muted: #707070;
  --grid: #1a1a1a; --axis: #262626; --line: #1f1f1f; --wash: #121417; --bar: #10233b; --bar-on: #173356;
  --r1: #3987e5; --r2: #d95926; --r3: #199e70; --r4: #c98500;
  --link: #ededed;
  --good: #3fbf6f; --warn: #e0a33a; --bad: #f06a6a;
  --t-learn: #9085e9; --t-collect: #d55181; --t-export: #6f6e69; --t-other: #2c2c2a; --t-setup: #55554f; --t-eval: #6f6e69; --t-run: #c3c2b7; --t-stage: #6f6e69; --t-wait: #55554f;
  --div-mid: #262626; --div-pos: #3fbf6f; --div-neg: #e66767;
}}
* { box-sizing: border-box; }
html { scroll-padding-top: 56px; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 "Geist", ui-sans-serif, -apple-system, "Inter", sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px 80px; }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
/* header + context */
.head { padding: 26px 0 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.head h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; flex: 1; min-width: 280px; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.pill.syn { color: #9a6400; border-color: #f1d9a6; background: #fff8e8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.syn { color: #f3c46a; border-color: #4a3910; background: #1d1606; } }
.context { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 10px 0 0; color: var(--ink-2); font-size: 13px; align-items: center; }
.context b { color: var(--ink); font-weight: 500; }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; color: var(--ink); }
.status i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.status.running i { background: var(--good); } .status.completed i { background: var(--ink-2); } .status.paused i { background: var(--warn); } .status.failed i { background: var(--bad); }
.detail { color: var(--warn); }
.caveat { flex-basis: 100%; color: var(--ink); background: var(--wash); border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
.budget { display: inline-flex; align-items: center; gap: 8px; }
.budget .track { width: 120px; height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
.budget .track span { display: block; height: 100%; background: var(--ink-2); }
/* controls */
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 18px 0 18px; }
.controls .lbl { color: var(--muted); font-size: 13px; }
.sec-controls { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; font-weight: 400; }
.sec-controls .lbl { color: var(--muted); }
select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 28px 6px 10px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 14px) 50%, calc(100% - 10px) 50%; background-size: 4px 4px; background-repeat: no-repeat; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; padding: 2px; gap: 2px; }
.seg button { font: inherit; font-size: 13px; border: 0; border-radius: 4px; background: none; color: var(--ink-2); padding: 3px 10px; cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--wash); color: var(--ink); font-weight: 500; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 6px 4px 10px; border-radius: 6px; background: var(--wash); border: 1px solid var(--line); }
.chip button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; }
.delta { font-size: 12px; font-weight: 500; padding: 1px 6px; border-radius: 4px; }
.delta.flat { color: var(--ink-2); background: var(--wash); }
/* section nav */
nav.tabs { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--page) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); margin: 8px -24px 0; padding: 0 24px; display: flex; gap: 22px; }
nav.tabs a { color: var(--ink-2); text-decoration: none; font-size: 14px; padding: 12px 0 10px; border-bottom: 2px solid transparent; }
nav.tabs a.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
section.sec { padding-top: 26px; }
section.sec > h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
section.sec > h2 span { color: var(--muted); font-size: 13px; font-weight: 400; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 14px; }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.multiples { grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 10px; min-width: 0; }
.card.full { grid-column: 1 / -1; }
.card h3 { margin: 0; font-size: 13.5px; font-weight: 600; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card h3 span { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.card .now { font-size: 20px; font-weight: 600; letter-spacing: -.01em; margin: 2px 0 4px; }
.card .na { color: var(--muted); font-size: 13px; padding: 18px 0 14px; }
.card .na code { font: 12px ui-monospace, Menlo, monospace; color: var(--ink-2); }
.key { display: flex; gap: 14px; color: var(--ink-2); font-size: 12.5px; flex-wrap: wrap; margin: 4px 0; }
.key i { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--ink-2); vertical-align: middle; margin-right: 6px; }
.key i.dash { border-top-style: dashed; }
/* rankings */
.li { position: relative; display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 6px 8px; margin: 2px 0; border-radius: 5px; cursor: pointer; font-size: 13px; overflow: hidden; }
.li .fill { position: absolute; inset: 0 auto 0 0; background: var(--bar); border-radius: 5px; }
.li.on .fill { background: var(--bar-on); }
.li > :not(.fill) { position: relative; }
.li .ci { color: var(--muted); font-size: 11.5px; } .li .v { font-weight: 500; min-width: 48px; text-align: right; }
.li .mid { position: absolute; left: 50%; top: 4px; bottom: 4px; border-left: 1px dashed var(--muted); opacity: .5; }
.li:hover { outline: 1px solid var(--axis); }
/* matrix */
.mwrap { overflow-x: auto; margin-top: 8px; }
.matrix { display: grid; gap: 2px; min-width: 480px; }
.matrix .cl, .matrix .rl { color: var(--ink-2); font-size: 11.5px; display: flex; align-items: center; }
.matrix .cl { justify-content: center; padding-bottom: 2px; } .matrix .rl { justify-content: flex-end; padding-right: 8px; }
.cell { border-radius: 3px; display: flex; align-items: center; justify-content: center; font: 500 11px/1 ui-monospace, Menlo, monospace; height: 30px; cursor: pointer; }
.cell:hover, .cell.on { outline: 2px solid var(--ink); outline-offset: 1px; }
.cell.none { background: repeating-linear-gradient(135deg, transparent 0 4px, var(--grid) 4px 5px); color: var(--muted); }
.legend { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; margin-top: 10px; flex-wrap: wrap; }
.legend .ramp { width: 140px; height: 8px; border-radius: 2px; }
/* time split + counters */
.split-row { display: grid; grid-template-columns: 150px 1fr 70px; gap: 12px; align-items: center; margin: 10px 0; font-size: 13px; }
.split-bar { display: flex; height: 14px; border-radius: 3px; overflow: hidden; gap: 2px; background: transparent; }
.split-bar span { display: block; height: 100%; }
.split-bar span:first-child { border-radius: 3px 0 0 3px; } .split-bar span:last-child { border-radius: 0 3px 3px 0; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.counter { display: grid; grid-template-columns: 22px 1fr auto 170px; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; }
.counter:first-of-type { border-top: 0; }
.counter .icon { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
.counter .icon.ok { background: var(--good); } .counter .icon.bad { background: var(--bad); } .counter .icon.na { background: var(--axis); color: var(--ink-2); }
.counter .k { font: 12px ui-monospace, Menlo, monospace; color: var(--ink-2); }
.counter .count { font-weight: 500; text-align: right; }
.counter .marks { height: 18px; position: relative; background: var(--grid); border-radius: 2px; }
.counter .marks i { position: absolute; top: 2px; bottom: 2px; width: 2px; background: var(--bad); border-radius: 1px; }
.missing { margin-top: 14px; color: var(--muted); font-size: 12.5px; }
.missing code { font: 11.5px ui-monospace, Menlo, monospace; color: var(--ink-2); background: var(--wash); padding: 1px 5px; border-radius: 4px; margin: 0 2px; display: inline-block; }
/* runs */
.legend-runs { display: flex; gap: 6px; flex-wrap: wrap; margin-right: 6px; }
.rbtn { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.rbtn i { width: 14px; height: 3px; border-radius: 2px; }
/* Baseline marks: dotted in the job's own color (set via color: on the element). */
i.dot { background: radial-gradient(circle, currentColor 1.2px, transparent 1.6px) 0 50% / 4px 3px repeat-x !important; }
.rbtn .tag, .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.rk .track b.dot { background: repeating-linear-gradient(90deg, currentColor 0 2px, transparent 2px 5px) !important; }
.tip-key.dotted { background: radial-gradient(circle, currentColor 1.2px, transparent 1.6px) 0 50% / 4px 3px repeat-x !important; height: 3px; }
.legend-runs .rbtn[aria-pressed=false] { color: var(--muted); } .legend-runs .rbtn[aria-pressed=false] i { background: var(--axis) !important; }
.tabs-in .rbtn[aria-pressed=true] { border-color: var(--ink); font-weight: 500; } .tabs-in .rbtn[aria-pressed=false] { color: var(--ink-2); }
.srow { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: baseline; font-size: 12.5px; margin-top: 4px; }
.srow i { width: 10px; height: 3px; border-radius: 2px; align-self: center; }
.srow span { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow b { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.srow b.na { font-size: 12.5px; font-weight: 400; color: var(--muted); }
.rk { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: center; padding: 5px 6px; border-radius: 5px; cursor: pointer; }
.rk:hover { outline: 1px solid var(--axis); } .rk.on { background: var(--wash); }
.rk > span { font-size: 13px; }
.rk .bars { display: grid; gap: 2px; }
.rk .bar { display: grid; grid-template-columns: 1fr 48px; gap: 8px; align-items: center; font-size: 11.5px; }
.rk .track { position: relative; height: 7px; background: var(--grid); border-radius: 2px; }
.rk .track b { position: absolute; inset: 0 auto 0 0; border-radius: 2px; }
.rk .track em { position: absolute; left: 50%; top: -2px; bottom: -2px; border-left: 1px dashed var(--muted); opacity: .6; }
.rk .bar span { text-align: right; color: var(--ink-2); }
.tabs-in { display: inline-flex; gap: 4px; margin: 6px 0 2px; flex-wrap: wrap; }
.mgrid { display: grid; gap: 10px 14px; align-items: center; margin-top: 8px; }
.mgrid .mh { font-size: 12.5px; color: var(--ink-2); text-align: center; }
.mgrid .mv { font-size: 12.5px; color: var(--ink-2); writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; }
.mini-title { font-size: 12.5px; color: var(--ink-2); font-family: ui-monospace, Menlo, monospace; }
/* flame */
.fl-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 6px 0 10px; }
.crumbs { display: flex; gap: 4px; align-items: center; font-size: 12.5px; color: var(--muted); flex: 1; min-width: 200px; flex-wrap: wrap; }
.crumbs button { font: inherit; border: 0; background: none; color: var(--link); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; padding: 0; }
.crumbs b { color: var(--ink); font-weight: 500; }
.fl-run { margin: 12px 0 4px; display: flex; justify-content: space-between; gap: 10px; font-size: 13px; flex-wrap: wrap; }
.fl-run span { color: var(--muted); }
.flame { position: relative; }
.fn { position: absolute; height: 24px; border-radius: 3px; font-size: 11.5px; line-height: 24px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--surface) 70%, transparent); }
.fn:hover { box-shadow: inset 0 0 0 2px var(--ink); }
.fn.uninstrumented { background: repeating-linear-gradient(135deg, var(--wash) 0 5px, var(--grid) 5px 7px) !important; color: var(--muted) !important; font-style: italic; cursor: default; }
.fn.hypothetical { font-style: italic; }
.fn.hypothetical::after { content: ' · illustrative'; opacity: .7; }
.fl-notes { color: var(--muted); font-size: 12px; margin-top: 8px; display: grid; gap: 2px; }
/* charts */
.chart-svg { display: block; width: 100%; height: auto; overflow: visible; }
line.grid { stroke: var(--grid); } line.axis { stroke: var(--axis); } line.ref { stroke: var(--muted); stroke-dasharray: 2 3; opacity: .6; } line.cross { stroke: var(--axis); }
text.tick, text.axis-label { fill: var(--muted); font-size: 11px; } text.empty { fill: var(--muted); font-size: 13px; }
.tip { position: fixed; display: none; pointer-events: none; z-index: 10; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; box-shadow: 0 6px 24px rgba(0,0,0,.08); font-size: 12.5px; }
.tip-title { color: var(--muted); margin-bottom: 4px; font-size: 12px; }
.tip-row { display: grid; grid-template-columns: 14px auto 1fr; gap: 8px; align-items: center; white-space: nowrap; }
.tip-key { width: 14px; height: 2px; } .tip-key.dashed { background: none !important; border-top: 2px dashed var(--ink-2); height: 0; }
.tip-label { color: var(--ink-2); }
@media (max-width: 900px) { .grid, .grid.three { grid-template-columns: 1fr; } .counter { grid-template-columns: 22px 1fr auto; } .counter .marks { grid-column: 2 / -1; } .split-row { grid-template-columns: 110px 1fr 56px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1 id="title"></h1><span class="pill" id="pill"></span><select id="exp" aria-label="Experiment"></select></div>
  <div class="context" id="context"></div>
  <div class="controls" id="controls">
    <div class="legend-runs" id="runs" role="group" aria-label="Runs"></div>
    <span id="chips" style="display:contents"></span>
  </div>
  <nav class="tabs" id="tabs"><a href="#evals" data-s="evals">Evals</a><a href="#perf" data-s="perf">Perf</a><a href="#ml" data-s="ml">ML details</a></nav>
  <section class="sec" id="evals"><h2>Evals <span id="evals-sub"></span><div class="sec-controls" id="evals-controls"></div></h2><div class="grid" id="evals-body"></div></section>
  <section class="sec" id="perf"><h2>Perf <span id="perf-sub"></span><div class="sec-controls" id="perf-controls"></div></h2><div class="grid" id="perf-body"></div></section>
  <section class="sec" id="ml"><h2>ML details <span id="ml-sub"></span><div class="sec-controls" id="ml-controls"></div></h2><div class="grid" id="ml-body"></div></section>
</div>
<script src="data.js"></script>
<script src="model.js"></script>
<script src="charts.js"></script>
<script>
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S = M.readHash({exp: 'seat-comparison', hide: '', mrun: '', mkey: '', anchor: '0', axis: '', deck: '', opp: '', seat: 'all', cell: '', smooth: 'on', taxis: 'updates', fscale: '', fpath: '', fres: 'Training · L4'});
const AX = {updates: 'Update', decisions: 'Learner decisions', hours: 'Training hours'};
const XF = {updates: M.num, decisions: M.num, hours: v => v.toFixed(v < 10 ? 1 : 0) + 'h'};
const setOf = s => new Set(s ? s.split(',').map(Number) : []);
const node = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const ago = t => { const s = Math.max(0, Date.now() / 1000 - t); return s < 3600 ? Math.round(s / 60) + 'm ago' : s < 86400 * 2 ? Math.round(s / 3600) + 'h ago' : Math.round(s / 86400) + 'd ago'; };
const when = t => new Date(t * 1000).toLocaleString([], {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'});
const UNIT = {bytes: v => (v / 1e9).toFixed(1) + ' GB', 'decisions/s': v => M.num(v) + '/s', 's': v => v.toFixed(1) + ' s', 'games/s': v => v.toFixed(1) + '/s', 'fraction': v => (v * 100).toFixed(0) + '%'};
const fmt = (unit, v) => v == null ? '—' : UNIT[unit] ? UNIT[unit](v) : Math.abs(v) >= 1000 ? M.num(v) : Math.abs(v) >= 10 ? v.toFixed(1) : Math.abs(v) >= 0.1 || v === 0 ? v.toFixed(2) : Math.abs(v) >= 0.01 ? v.toFixed(3) : v.toExponential(1);
// Exponential moving average over recorded points; gaps reset nothing and stay gaps.
const ema = (points, alpha = 0.08) => { let m = null; return points.map(p => { if (p.missing) return p; m = m == null ? p.y : m + alpha * (p.y - m); return {...p, y: m}; }); };

function seg(id, options, key) {
  const host = document.getElementById(id); host.replaceChildren();
  for (const [value, label] of options) { const b = node('button', null, label); b.setAttribute('aria-pressed', String(S[key] === value)); b.onclick = () => { S[key] = value; render(); }; host.appendChild(b); }
}
// A labeled segmented control bound to one state key; re-renders on change.
function control(host, label, options, key) {
  const lab = node('span', 'lbl', label), group = node('div', 'seg'); group.setAttribute('role', 'group'); group.setAttribute('aria-label', label);
  for (const [value, text] of options) { const b = node('button', null, text); b.setAttribute('aria-pressed', String(S[key] === value)); b.onclick = () => { S[key] = value; render(); }; group.appendChild(b); }
  host.append(lab, group);
}
const CLOCKS = [['updates', 'Updates'], ['decisions', 'Learner decisions'], ['hours', 'Training hours']];
function card(host, title, sub, cls = '') {
  const c = node('div', 'card ' + cls), h = node('h3', null, title); if (sub) h.appendChild(node('span', null, sub)); c.appendChild(h); host.appendChild(c); return c;
}

// ---- Flame (icicle). Width = seconds; rows = timer depth. The zoom path is a
// list of node names, applied to every run so the same branch lines up.
const CAT = {run: '--t-run', stage: '--t-stage', learning: '--t-learn', collection: '--t-collect', export: '--t-export', setup: '--t-setup', eval: '--t-eval', wait: '--t-wait', unattributed: '--t-other'};
function hexMix(a, b, t) { const h = x => x.replace('#', '').match(/../g).map(v => parseInt(v, 16)); const pa = h(a), pb = h(b); return `rgb(${pa.map((c, i) => Math.round(c + (pb[i] - c) * t)).join(',')})`; }
const dur = s => s >= 3600 ? (s / 3600).toFixed(2) + ' h' : s >= 60 ? (s / 60).toFixed(1) + ' min' : s.toFixed(s < 1 ? 2 : 1) + ' s';
// Evaluation activities group existing, compatible timers only. Inference wait
// in a game must never be added to the serving process time it overlaps.
const EVAL_RESOURCES = {
  'Worker elapsed (sum, overlaps)': ['During games', 'Time summed across game processes, including waits. Concurrent games overlap: this is a breakdown of game activity, not how long the comparison took. Inference includes queueing, communication and model execution.'],
  'Cell elapsed': ['Comparison elapsed', 'Elapsed time for this comparison panel through replay. Excludes earlier checkpoint preparation and server provisioning. Game activity happens inside this interval; do not add the two totals.'],
  'Worker CPU (sum)': ['Game CPU usage', 'CPU time consumed by game processes, summed across cores. Excludes waiting and the separate inference process; phase-level CPU attribution is unavailable.'],

    const start = Math.min(...spans.map(s => s.start)), end = Math.max(...spans.map(s => s.end));

}
// The anchor is the opponent: name both sides by who plays them.
const sideName = (e, f) => e.anchors[f.anchor] || 'opponent';
const matchName = (e, f, d, o) => `model ${e.deck_names[d]} vs ${sideName(e, f)} ${e.deck_names[o]}`;
const draws = [];
const later = fn => draws.push(fn);

function render() {

  if (!S.axis) S.axis = L.clock;
  const jobs = jobsOf(e), hidden = new Set(S.hide ? S.hide.split('|') : []);
  const vis = jobs.map((_, j) => j).filter(j => !hidden.has(jobs[j].id));
  // Color follows the job's declared position, never its rank or visibility.
  const color = j => css(['--r1', '--r2', '--r3', '--r4'][j % 4]);

  const f = {anchor: +S.anchor, seat: S.seat === 'all' ? 'all' : +S.seat, decks: setOf(S.deck), opps: setOf(S.opp)};

  // ---- header + context

  const pill = document.getElementById('pill'); pill.textContent = e.source; pill.className = 'pill' + (e.synthetic ? ' syn' : '');

  exp.onchange = () => { Object.assign(S, {exp: exp.value, hide: '', mrun: '', mkey: '', deck: '', opp: '', seat: 'all', anchor: '0', fpath: '', axis: ''}); render(); };

  if (C.budget) { const b = node('span', 'budget', 'Budget '); const t = node('span', 'track'); const fill = node('span'); fill.style.width = Math.min(100, C.budget.spent / C.budget.ceiling * 100) + '%'; t.appendChild(fill); b.append(t, node('b', null, `Spent $${C.budget.spent.toFixed(2)}`), ` · $${(C.budget.ceiling - C.budget.spent).toFixed(2)} left of $${C.budget.ceiling.toFixed(0)} ceiling`); ctx.appendChild(b); }

  const chip = (text, clear) => { const c = node('span', 'chip', text); const b = node('button', null, '×'); b.setAttribute('aria-label', 'Remove filter ' + text); b.onclick = clear; c.appendChild(b); chips.appendChild(c); };
  if (S.deck) chip('Model plays: ' + [...setOf(S.deck)].map(i => e.deck_names[i]).join(', '), () => { S.deck = ''; render(); });
  if (S.opp) chip(`${e.anchors[+S.anchor] || 'Opponent'} plays: ` + [...setOf(S.opp)].map(i => e.deck_names[i]).join(', '), () => { S.opp = ''; render(); });
  if (S.seat !== 'all') chip('Model seat: ' + (S.seat === '0' ? 'play' : 'draw'), () => { S.seat = 'all'; render(); });

  // ---- shared eval state. Cross-run numbers use the latest update every visible run evaluated.
  const curves = Object.fromEntries(vis.map(j => [j, jobCurve(e, jobs[j], f)]));
  const cap = Math.min(...vis.map(j => Math.max(...curves[j].filter(p => !p.missing).map(p => p.key))));
  const sharedKeys = (curves[vis[0]] || []).filter(p => !p.missing && vis.every(i => curves[i].some(q => !q.missing && q.key === p.key))).map(p => p.key);
  const common = sharedKeys.length ? Math.max(...sharedKeys) : null;
  const at = (i, u) => curves[i].find(p => p.key === u);
  // How a shared point is named: a learner-decision milestone or an update.
  const aligned = e.runs[0]?.evals.some(v => v.align != null);
  const keyName = k => aligned ? `${M.num(k)} learner decisions` : `update ${M.num(k)}`;
  const latestOf = i => [...curves[i]].reverse().find(p => !p.missing);
  // The update a job's breakdowns use: the shared one when it exists, else its latest.
  const evAt = j => common != null ? common : (latestOf(j)?.key ?? 0);
  const train = j => jobs[j].runs.every(i => e.training.series.some(s => s.run === i));
  const metricPoints = (j, key) => jobMetric(e, jobs[j], key, S.taxis);
  const lastOf = (i, key) => { const p = metricPoints(i, key); if (!p) return null; const q = p.filter(x => !x.missing); return q.length ? q[q.length - 1].y : null; };
  const scorePts = c => c.map(p => ({x: M.x(p, S.axis), y: p.score, lo: p.lo, hi: p.hi, missing: p.missing, meta: p.seeds && p.seeds.length > 1 ? `mean of ${p.seeds.length} seeds: ${p.seeds.map(M.pct).join(', ')}` : p.n ? p.n + ' games' : p.meta || (S.seat !== 'all' ? 'no seat split' : '')}));
  const upToCap = c => c.filter(p => p.key <= cap);
  const runSeries = (fn, opts = {}) => vis.map(i => ({label: label(i), color: color(i), dotted: dotted(i), points: fn(i), ...opts}));
  const srow = (host, i, value, na) => { const r = node('div', 'srow'); const sw = swatch(i); r.append(sw, node('span', null, label(i)), node('b', na ? 'na' : '', value)); host.appendChild(r); return r; };

  // ---- Evals: render each declared panel in order, every visible run.
  const evalsBody = document.getElementById('evals-body'); evalsBody.replaceChildren();
  document.getElementById('evals-sub').textContent = `${e.decks.length} decks · vs ${e.anchors[f.anchor]}` + (common != null ? ` · jobs compared at ${keyName(common)}` : ' · no point evaluated by every job');
  const lineOpts = {yFormat: v => Math.round(v * 100) + '%', xFormat: XF[S.axis], xLabel: AX[S.axis], ref: 0.5};
  let rankingRow = null;
  for (const panel of L.evals) {
    if (panel.kind !== 'ranking') rankingRow = null;
    if (panel.kind === 'curve' && !panel.split) {
      const multi = vis.some(j => jobs[j].runs.length > 1);
      const c = card(evalsBody, panel.title.replace('anchor', e.anchors[f.anchor]), `mean over seeds · band: ${multi ? 'seed range (several seeds), ' : ''}95% game interval (one seed) · through ${keyName(cap)}`, 'full');
      const body = node('div'); c.appendChild(body);
      later(() => Charts.line(body, runSeries(i => scorePts(upToCap(curves[i]))), {...lineOpts, height: 260}));
    } else if (panel.kind === 'curve') {
      const k = e.decks.length, anchor = sideName(e, f);
      const sub = {matchup: `columns: model's deck · rows: ${anchor}'s deck`, deck: `model's deck · pooled over ${anchor} decks`, opponent: `${anchor}'s deck · pooled over model decks`, seat: "model's seat"}[panel.split];
      const c = card(evalsBody, panel.title, sub, 'full');
      const chart = (host, extra) => later(() => Charts.line(host, runSeries(j => scorePts(upToCap(jobCurve(e, jobs[j], {...f, ...extra})))), {...lineOpts, compact: true, height: 130, band: false}));
      if (panel.split === 'matchup') {
        // Same orientation as the matrix: model deck across, anchor deck down.

        grid.appendChild(node('div'));
        for (let d = 0; d < k; d++) grid.appendChild(node('div', 'mh', `Model plays ${e.deck_names[d]}`));
        for (let o = 0; o < k; o++) {

        }

        const grid = node('div', 'grid multiples'); c.appendChild(grid);
        const groups = panel.split === 'deck' ? e.decks.map((_, d) => ({title: `Model plays ${e.deck_names[d]}`, f: {decks: new Set([d])}}))
          : panel.split === 'opponent' ? e.decks.map((_, o) => ({title: `${anchor} plays ${e.deck_names[o]}`, f: {opps: new Set([o])}}))
          : [0, 1].map(s => ({title: s ? 'Model on the draw' : 'Model on the play', f: {seat: s}}));

      const last = e.direct[e.direct.length - 1], a = M.agg([[0, 0, 0, 0, 0, 0, last.wins, last.draws, last.losses]]);
      c.appendChild(node('div', 'now', `${M.pct(a.score)}  ·  ${a.w}–${a.d}–${a.l} at update ${M.num(last.updates)}`));
      const body = node('div'); c.appendChild(body);
      later(() => Charts.line(body, [{label: `${label(0)} vs ${label(1)}`, color: css('--ink-2'), points: e.direct.map(d => { const x = M.agg([[0, 0, 0, 0, 0, 0, d.wins, d.draws, d.losses]]); return {x: d.updates, y: x.score, lo: x.lo, hi: x.hi, meta: `${x.w}–${x.d}–${x.l}`}; })}], {...lineOpts, xFormat: M.num, xLabel: 'Update', whiskers: true, height: 180}));

      // Defaults to the job's latest scored checkpoint; the selector can step back.

      const seedNote = jobs[run].runs.length > 1 ? ` · pooled over ${jobs[run].runs.length} seeds` : '';
      const sub = (W.length > 1 ? `pooled ${keyName(W[0])} – ${keyName(W[W.length - 1])}` : keyName(u)) + seedNote + ` · columns: model's deck · rows: ${sideName(e, f)}'s deck · model's score`;
      const c = card(evalsBody, panel.title, sub, 'full');
      const tabsIn = node('div', 'tabs-in');
      for (const i of vis) { const b = node('button', 'rbtn'); b.append(swatch(i), label(i)); b.setAttribute('aria-pressed', String(i === run)); b.onclick = () => { S.mrun = jobs[i].id; render(); }; tabsIn.appendChild(b); }
      const pick = document.createElement('select'); pick.setAttribute('aria-label', 'Checkpoint');
      for (const key of [...keys].reverse()) pick.appendChild(new Option(keyName(key) + (key === keys[keys.length - 1] ? ' · latest' : ''), key, false, key === u));

        }
      }
      const legend = node('div', 'legend'), ramp = node('span', 'ramp');
      ramp.style.background = `linear-gradient(90deg, ${Charts.diverging(0, 0, 0.5, 1)}, ${css('--div-mid')}, ${Charts.diverging(1, 0, 0.5, 1)})`;
      legend.append(node('span', null, 'model loses'), ramp, node('span', null, 'model wins'), node('span', null, `· ${cells ? Math.round(n / cells) : 0} games per cell · faded where the interval includes 50% · click a cell to filter`));

    } else if (panel.kind === 'ranking') {

      const title = {deck: "Model's deck", opponent: `${sideName(e, f)[0].toUpperCase() + sideName(e, f).slice(1)}'s deck`, seat: "Model's seat", matchup: 'Matchup'}[panel.by];

        ? [0, 1].map(s => ({label: s ? 'On the draw' : 'On the play', f: {seat: s}, on: S.seat === String(s), click: () => { S.seat = S.seat === String(s) ? 'all' : String(s); render(); }}))
        : e.decks.map((_, j) => { const key = panel.by === 'deck' ? 'deck' : 'opp'; return {label: e.deck_names[j], f: {[key === 'deck' ? 'decks' : 'opps']: new Set([j])}, on: setOf(S[key]).has(j), click: () => { const x = setOf(S[key]); x.has(j) ? x.delete(j) : x.add(j); S[key] = [...x].join(','); render(); }}; });
      for (const r of rows) { r.by = vis.map(j => [j, M.agg(jobCells(e, jobs[j], evAt(j), {...f, ...r.f}))]); const v = r.by.filter(([, a]) => a); r.mean = v.length ? v.reduce((s, [, a]) => s + a.score, 0) / v.length : -1; }

      }

  }

  // ---- Perf and ML details: metric panels over training series, every visible run.
  const silent = vis.filter(j => !train(j));
  const missing = {perf: [], ml: []};
  const metricSection = (section, panels) => {
    const host = document.getElementById(section + '-body'); host.replaceChildren();
    for (const panel of panels) {
      if (panel.kind === 'flame') {
        const c = card(host, panel.title, '', 'full');
        renderFlame(c, e, vis.map(j => ({j, label: label(j) + (dotted(j) ? ' · baseline' : ''), color: color(j), get: res => jobTiming(e, jobs[j], res)})), panel);
      } else if (panel.kind === 'counters') {
        if (!panel.keys.some(k => vis.some(i => metricPoints(i, k)))) { panel.keys.forEach(k => missing[section].push(k)); continue; }
        const c = card(host, panel.title, 'expected to stay at zero');
        for (const k of panel.keys) {
          const head = node('div', 'mini-title', k); head.style.marginTop = '10px'; c.appendChild(head);
          for (const i of vis) {
            const pts = metricPoints(i, k), row = node('div', 'counter'), span = pts ? pts.map(p => p.x) : [];
            const runLabel = node('span', null, label(i)); runLabel.style.color = 'var(--ink-2)';
            if (!pts) { row.append(node('span', 'icon na', '–'), runLabel, node('span', 'count', 'not retained'), node('span')); c.appendChild(row); continue; }
            const hits = pts.filter(p => !p.missing && p.y > 0), total = hits.reduce((s, p) => s + p.y, 0);
            row.append(node('span', 'icon ' + (total ? 'bad' : 'ok'), total ? '!' : '✓'), runLabel, node('span', 'count', total ? `${total} at ${hits.length} updates` : '0'));
            const marks = node('span', 'marks'); const lo = span[0] || 0, hi = span[span.length - 1] || 1;
            for (const h of hits) { const m = node('i'); m.style.left = ((h.x - lo) / (hi - lo || 1) * 100) + '%'; marks.appendChild(m); }
            marks.onpointermove = evt => Charts.showTip(evt, [{value: total ? hits.slice(0, 6).map(h => 'update ' + M.num(h.x)).join(', ') + (hits.length > 6 ? '…' : '') : 'none', label: ''}], `${label(i)} · ${k}`);
            marks.onpointerleave = Charts.hideTip; row.appendChild(marks); c.appendChild(row);
          }
        }
      } else if (panel.kind === 'series') {
        const present = panel.keys.filter(k => vis.some(i => metricPoints(i, k)));
        panel.keys.filter(k => !present.includes(k)).forEach(k => missing[section].push(k));
        if (!present.length) continue;
        const log = panel.scale === 'log';
        const prep = series => {
          let out = log ? series.map(s => ({...s, points: s.points.map(p => ({...p, y: p.y > 0 ? Math.log10(p.y) : null, missing: p.missing || !(p.y > 0)}))})) : series;
          // Smoothed: faint raw line underneath, EMA on top.
          if (S.smooth === 'on') out = [...out.map(s => ({...s, label: s.label + ' (raw)', opacity: 0.22, width: 1})), ...out.map(s => ({...s, points: ema(s.points)}))];
          return out;
        };
        const opts = {band: false, dots: false, xFormat: XF[S.taxis], xLabel: AX[S.taxis], yFormat: log ? y => fmt('', 10 ** y) : y => fmt(panel.unit, y)};
        const withData = k => vis.filter(i => metricPoints(i, k));
        if (present.length === 1) {
          const k = present[0], c = card(host, panel.title, panel.unit);
          for (const i of withData(k)) srow(c, i, fmt(panel.unit, lastOf(i, k)));
          const body = node('div'); c.appendChild(body);
          later(() => Charts.line(body, prep(withData(k).map(i => ({label: label(i), color: color(i), dotted: dotted(i), points: metricPoints(i, k)}))), {...opts, height: 170}));
        } else {
          // Several keys: one small chart per key, every run on each.
          const c = card(host, panel.title, panel.unit, 'full'), grid = node('div', 'grid multiples'); c.appendChild(grid);
          for (const k of present) {
            const m = node('div'); m.appendChild(node('div', 'mini-title', k)); const body = node('div'); m.appendChild(body); grid.appendChild(m);
            later(() => Charts.line(body, prep(withData(k).map(i => ({label: label(i), color: color(i), dotted: dotted(i), points: metricPoints(i, k)}))), {...opts, compact: true, height: 140}));
          }
        }
      }
    }
    if (missing[section].length) {
      const m = node('div', 'missing card full', 'Logged by the trainer but not retained for these runs: ');
      m.style.border = '0'; m.style.padding = '0';
      missing[section].forEach(k => m.appendChild(node('code', null, k))); host.appendChild(m);
    }
  };
  metricSection('perf', L.perf); metricSection('ml', L.ml);
  renderEvalPerformance(document.getElementById('perf-body'), e, vis.flatMap(j => jobs[j].runs));
  renderInferencePerformance(document.getElementById('perf-body'), e, vis.flatMap(j => jobs[j].runs));
  for (const section of ['evals', 'ml']) {
    const shown = L[section].length > 0;
    document.getElementById(section).hidden = !shown;
    document.querySelector(`[data-s=${section}]`).hidden = !shown;
  }
  const note = e.inference_performance?.runs.length ? 'separate workload cohorts · retained measurements and unknowns' : e.eval_performance ? 'evaluation decisions · host measurements and coverage' : silent.length ? `no per-update telemetry retained for ${silent.map(label).join(', ')}` : 'one point per training update';
  document.getElementById('perf-sub').textContent = note;
  document.getElementById('ml-sub').textContent = note;
  for (const d of draws) d();
}

// Section nav highlights the section in view.
const tabs = [...document.querySelectorAll('nav.tabs a')];
const io = new IntersectionObserver(entries => { for (const en of entries) if (en.isIntersecting) tabs.forEach(t => t.classList.toggle('on', t.dataset.s === en.target.id)); }, {rootMargin: '-40% 0px -55% 0px'});
['evals', 'perf', 'ml'].forEach(id => io.observe(document.getElementById(id)));
tabs.forEach(t => t.onclick = evt => { evt.preventDefault(); document.getElementById(t.dataset.s).scrollIntoView({behavior: 'smooth'}); });
render();
let pending; addEventListener('resize', () => { clearTimeout(pending); pending = setTimeout(render, 120); });
</script>
</body>
</html>
