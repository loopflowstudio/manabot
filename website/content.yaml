# Manabot website content
# Edit copy here — no need to touch main.py

homepage:
  hero:
    tagline: "Training superhuman Magic bots."
    subline: >-
      Manabot is an open research project to train superhuman Magic: The
      Gathering bots: a deterministic Rust rules engine built for learning,
      and Python agents trained by self-play, search, and belief models over
      hidden cards.
    play_url: "https://play.manabot.gg"
    repo_url: "https://github.com/loopflowstudio/manabot"

  showcase:
    image: "/static/board-developed.png"
    image_alt: "The bot inspection table mid-game: two players' battlefields on a parchment sheet, with the game log and actions in the margin"
    caption: "The inspection table: watch a trained bot play one game, or step through a replay decision by decision."

  pillars:
    heading: "Two halves"
    items:
      - title: "managym"
        register: "forest"
        description: >-
          The deterministic Rust rules engine and vectorized environment the
          agent lives in. Fast batched stepping, exact clone and fork for
          search, replay, and per-player observations that keep hidden
          information hidden.
      - title: "manabot"
        register: "mountain"
        description: >-
          The agents: self-play training, search, belief models over hidden
          cards, and an arena that plays checkpoints against each other and
          against fixed opponents. A small manabot trains on a laptop CPU in
          under a minute; longer runs go to rented GPUs.

  play:
    heading: "Inspect a bot"
    intro: >-
      You need uv, Node, and a Rust toolchain. One command builds the engine
      and opens a local table for stepping through a trained bot's decisions
      or a replay. It is a tool for inspecting bots, not a way to play Magic.
    code: |
      git clone git@github.com:loopflowstudio/manabot.git
      cd manabot
      ./scripts/play

  train:
    heading: "Train a manabot"
    intro: >-
      No accounts, no GPU. A small self-play run finishes in under a minute
      and saves checkpoints locally.
    code: |
      uv run manabot train

  research:
    heading: "The research ledger"
    body: >-
      Experiments are preregistered: each states its prediction, budget, and
      kill criteria before it runs, and negative results are recorded
      alongside positive ones.
    link_label: "Read the ledger on GitHub"
    link_url: "https://github.com/loopflowstudio/manabot/tree/main/experiments"

colophon:
  identity: >-
    An independent research project on training superhuman Magic: The
    Gathering bots.
  built_by: "Built by Loopflow Studio."
  built_by_url: "https://loopflow.studio"
  fan_content: >-
    Manabot is unofficial Fan Content permitted under the Wizards of
    the Coast Fan Content Policy. Card art and mana symbols are © Wizards of
    the Coast. Not approved or endorsed by Wizards.
  fan_content_policy_url: "https://company.wizards.com/en/legal/fancontentpolicy"
