[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "manabot"
version = "0.2.3"
description = "The trainable Magic: The Gathering agent for Manabot"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "managym==0.2.3",
    # Split markers keep uv group-specific CPU/CUDA indexes disjoint.
    "torch>=2.15.0 ; sys_platform == 'linux'",
    "torch>=2.15.0 ; sys_platform != 'linux'",
    "numpy>=1.24.0",
    "nbformat>=5.10.0",
    "gymnasium>=1.0.0",
    "pydantic>=2.12.0",
    "typer>=0.12.5",
    "psutil>=5.9.0",
    "etude-sdk>=0.2.16",
]

[project.scripts]
manabot = "manabot.cli:main"

[project.optional-dependencies]
openrouter = ["httpx>=0.28,<1"]
llm = [
    "huggingface-hub>=1.3,<2",
    "transformers[chat-template]==5.3.0",
]
reports = [
    "etude-sdk[s3]>=0.2.16",
    "matplotlib>=3.9",
]
artifacts = [
    "boto3>=1.35.0",
]
academy = ["managym[academy]==0.2.3"]
evaluation = [
    "etude-sdk[eval]>=0.2.16",
    "matplotlib>=3.9",
]
# Apple Silicon only: the MLX backend (manabot/backends/mlx.md).
mlx = [
    "mlx>=0.29 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
play = [
    "maturin>=1.9.3,<2.0",
]
dev = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.34.0",
    "pytest>=7.0.0",
    "pytest-xdist>=3.6",
    "httpx>=0.28.0",
    "jsonschema>=4.23.0",
    "ruff>=0.9.0",
]
notebook = [
    "jupyterlab>=4.0",
    "nbclient>=0.10",
    "matplotlib>=3.9",
]

[dependency-groups]
training-runtime = [
    "torch==2.15.0+cu132 ; sys_platform == 'linux'",
    "torch==2.15.0 ; sys_platform != 'linux'",
]
play-runtime = [
    "fastapi>=0.116.0",
    # A trained opponent loads through manabot's model and env packages,
    # which import these at module load.
    "gymnasium>=1.0.0",
    "maturin>=1.9.3,<2.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    "torch==2.15.0",
    "uvicorn[standard]>=0.34.0",
    "etude-sdk==0.2.16",
]

[tool.uv]
default-groups = ["training-runtime"]
conflicts = [
    [
        { group = "training-runtime" },
        { group = "play-runtime" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-training"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.workspace]
members = ["managym"]

[tool.uv.sources]
managym = { workspace = true }
torch = [
    { index = "pytorch-cpu", group = "play-runtime" },
    { index = "pytorch-cuda", group = "training-runtime", marker = "sys_platform == 'linux'" },
    { index = "pytorch-training", group = "training-runtime", marker = "sys_platform != 'linux'" },
]

[project.entry-points."managym.academy.bots"]
manabot = "manabot.sim.table_bots:extension"

[project.urls]
Homepage = "https://manabot.gg"
Repository = "https://github.com/loopflowstudio/manabot"

[tool.hatch.build]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.so", "**/*.dylib"]

[tool.hatch.build.targets.sdist]
include = ["/manabot", "/content/semantic", "/docs/experiment-metrics.md", "/protocol/experience-v1.schema.json", "/.manabot-source.json", "/README.md", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["manabot"]

[tool.hatch.build.targets.wheel.force-include]
"content/semantic" = "content/semantic"
"docs/experiment-metrics.md" = "docs/experiment-metrics.md"
"protocol/experience-v1.schema.json" = "protocol/experience-v1.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running integration checks",
    "training: runs PPO training (minutes, not seconds)",
]

[tool.ruff]
extend-exclude = [
    "tests/fixtures/seventeenlands/mtga_follower.py",
    "managym/tests/fixtures/payment_search/manabot_slow_step.py",
]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["managym", "conformance", "experiments", "manabot"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
