[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "manabot"
version = "0.2.0"
description = "The trainable Magic: The Gathering agent for Manabot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "nbformat>=5.10.0",
    "gymnasium>=1.0.0",
    "pydantic>=2.12.0",
    "typer>=0.12.5",
    "psutil>=5.9.0",
    "etude-sdk==0.2.6",
]

[project.scripts]
manabot = "manabot.cli:main"

[project.optional-dependencies]
llm = [
    "huggingface-hub>=1.3,<2",
    "transformers[chat-template]==5.3.0",
    "torch==2.10.0",
]
reports = [
    "etude-sdk[s3]==0.2.6 ; python_version >= '3.12'",
    "matplotlib>=3.9",
]
artifacts = [
    "boto3>=1.35.0",
]
academy = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.34.0",
]
evaluation = [
    "etude-sdk[eval]==0.2.6",
    "matplotlib>=3.9",
]
play = [
    "maturin>=1.5,<2.0",
]
dev = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.34.0",
    "pytest>=7.0.0",
    "httpx>=0.28.0",
    "jsonschema>=4.23.0",
    "ruff>=0.9.0",
]
notebook = [
    "jupyterlab>=4.0",
    "nbclient>=0.10",
    "matplotlib>=3.9",
]

[dependency-groups]
training-runtime = [
    "torch==2.10.0+cu128 ; sys_platform == 'linux'",
    "torch==2.10.0 ; sys_platform != 'linux'",
]
play-runtime = [
    "fastapi>=0.116.0",
    # A trained opponent loads through manabot's model and env packages,
    # which import these at module load.
    "gymnasium>=1.0.0",
    "maturin>=1.5,<2.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    "torch==2.10.0",
    "uvicorn[standard]>=0.34.0",
    "etude-sdk==0.2.6",
]

[tool.uv]
default-groups = ["training-runtime"]
conflicts = [
    [
        { group = "training-runtime" },
        { group = "play-runtime" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-training"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "play-runtime" },
    { index = "pytorch-cuda", group = "training-runtime", marker = "sys_platform == 'linux'" },
    { index = "pytorch-training", group = "training-runtime", marker = "sys_platform != 'linux'" },
]

[project.urls]
Homepage = "https://manabot.gg"
Repository = "https://github.com/loopflowstudio/manabot"

[tool.manabot.release]
# Published wheels need Torch; source uv groups select CPU/CUDA separately.
runtime-dependencies = ["torch==2.10.0"]

[tool.maturin]
bindings = "pyo3"
features = ["python"]
manifest-path = "managym/Cargo.toml"
module-name = "manabot.managym._managym"
python-source = "."
python-packages = ["manabot", "academy", "managym"]
zip64 = true
include = [
    { path = "content/semantic/**/*.json", format = ["sdist", "wheel"] },
    { path = "docs/experiment-metrics.md", format = ["sdist", "wheel"] },
    { path = "protocol/experience-v1.schema.json", format = ["sdist", "wheel"] },
    { path = ".manabot-source.json", format = ["sdist", "wheel"] },
    { path = "README.md", format = "sdist" },
]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    "academy/ui/node_modules/**",
    "academy/ui/.svelte-kit/**",
    "academy/ui/build/**",
    "academy/ui/e2e/**",
    "academy/ui/static/**",
    { path = "managym/src/**", format = "wheel" },
    { path = "managym/tests/**", format = "wheel" },
    { path = "managym/examples/**", format = "wheel" },
    "managym/target/**",
    "managym/libmanagym.dylib.dSYM/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running integration checks",
    "training: runs PPO training (minutes, not seconds)",
]

[tool.ruff]
extend-exclude = ["tests/fixtures/seventeenlands/mtga_follower.py"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["academy", "experiments", "manabot"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
