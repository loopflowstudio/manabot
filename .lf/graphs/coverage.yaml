# Narrow code fork for card coverage: cohort-sliced build, unified concept/card
# review + realign, targeted new-card performance gate, final compress, then
# ship-review and deliver.
- loop:
    - card-batch
    - loop:
        - loop:
            - cmd: sync
            - card-implement           # one cohort slice; updates scratch/plan.md and decides: next slice or review
        - card-review                  # read-only review (extends concept-review); writes scratch/concept-review.html
        - realign                      # reconciles findings into scratch/plan.md and decides: fix pass or advance
    - xor:
        router: card-perf              # fast check: new-card bench_states scaling + base no-regression check
        paths:
          clean:
            description: New cards scale linearly and branch does not regress bench_steps or bench_search
          optimize:
            graph: engine-optimization
            description: Branch regressed bench_steps/bench_search or a new card's stress state scales superlinearly
    - compress
    - pr-publish
    - interactive: ship-review
- graph: deliver
