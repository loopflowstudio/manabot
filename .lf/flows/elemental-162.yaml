- cmd: task wait MTG-161 --until terminal
- xor:
    router: xor-route
    paths:
      build:
        description: "Read lf task status MTG-161 --json fresh. Select build only when task.completed is true and its required delivery is verified. A terminated, stopped, failed or published Flow alone is insufficient. Dependency MTG-161 must actually be complete. The user authorized autonomous implementation and landing without human review."
        flow: elemental-162-deliver
      dependency_blocked:
        description: "Select this no-op exit when fresh status cannot prove dependency MTG-161 completed its accepted delivery. Record the exact missing dependency or read; do not implement, publish, complete this Task, launch another Flow, or waive the prerequisite. Report through the existing Task records."
