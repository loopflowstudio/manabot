name: Release packages

on:
  pull_request:
    paths:
      - 'manabot/**'
      - 'managym/**'
      - 'academy/**'
      - 'content/**'
      - 'scripts/release/**'
      - 'tests/infra/test_release.py'
      - 'release/**'
      - 'pyproject.toml'
      - 'LICENSE'
      - 'uv.lock'
      - '.github/workflows/release.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Validate versions and release tag
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$IS_TAG" = true ]; then
            git merge-base --is-ancestor HEAD origin/main
            uv run --no-project python scripts/release/check.py --tag "$RELEASE_TAG"
          else
            uv run --no-project python scripts/release/check.py
          fi
      - name: Build both source distributions and the pure-Python wheel
        run: |
          uv run --no-project python scripts/release/prepare.py staging
          uv build --no-sources --sdist staging/managym --out-dir dist
          uv build --no-sources --sdist staging --out-dir dist
          mkdir bot-source
          tar -xzf dist/manabot-*.tar.gz -C bot-source --strip-components=1
          uv build --no-sources --wheel bot-source --out-dir dist
          uv run --no-project --with twine twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-sources
          path: dist/*
          if-no-files-found: error
      - name: Check release tooling
        run: uv run --no-project --with pytest pytest --confcutdir=tests/infra tests/infra/test_release.py -q

  package:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
        platform:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: macos-15, target: aarch64 }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: release-sources
          path: source
      - name: Unpack the engine source distribution
        run: |
          mkdir wheel-source
          tar -xzf source/managym-*.tar.gz -C wheel-source --strip-components=1
      - name: Build managym wheel from its sdist
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: '2_28'
          args: --release --locked -m wheel-source/managym/Cargo.toml -i python${{ matrix.python }} --out dist
      - run: uv run --no-project --with twine twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-engine-${{ matrix.platform.target }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
        platform:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: macos-15, target: aarch64 }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: release-engine-${{ matrix.platform.target }}-${{ matrix.python }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-sources
          path: dist
      - name: Install engine alone and play a complete game outside the checkout
        shell: bash
        run: |
          uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/release-venv"
          # Only binary distributions can be installed; Rust is unavailable to this proof.
          mkdir "$RUNNER_TEMP/no-rust"
          for command in cargo rustc rustup; do
            printf '#!/bin/sh\necho "Rust is unavailable in the consumer proof" >&2\nexit 1\n' > "$RUNNER_TEMP/no-rust/$command"
            chmod +x "$RUNNER_TEMP/no-rust/$command"
          done
          export PATH="$RUNNER_TEMP/no-rust:$PATH"
          uv pip install --python "$RUNNER_TEMP/release-venv/bin/python" --only-binary :all: dist/managym-*.whl
          cp scripts/release/engine_smoke.py "$RUNNER_TEMP/engine_smoke.py"
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          uv run --no-project --python "$RUNNER_TEMP/release-venv/bin/python" engine_smoke.py
      - name: Install wheel and exercise CPU training outside the checkout
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/no-rust:$PATH"
          uv pip install --python "$RUNNER_TEMP/release-venv/bin/python" --only-binary :all: --torch-backend cpu dist/managym-*.whl dist/manabot-*.whl 'torch==2.15.0' 'etude-sdk==0.2.15'
          uv pip check --python "$RUNNER_TEMP/release-venv/bin/python"
          cp scripts/release/smoke.py "$RUNNER_TEMP/smoke.py"
          cd "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/release-venv/bin:$PATH"
          unset PYTHONPATH
          uv run --no-project --python "$RUNNER_TEMP/release-venv/bin/python" smoke.py
      - name: Verify optional API and report dependencies
        shell: bash
        run: |
          wheel=$(echo "$GITHUB_WORKSPACE"/dist/manabot-*.whl)
          uv pip install --python "$RUNNER_TEMP/release-venv/bin/python" --torch-backend cpu "${wheel}[academy,reports,artifacts,evaluation,notebook,llm,openrouter]"
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          uv run --no-project --python "$RUNNER_TEMP/release-venv/bin/python" python -c 'import academy.server; import manabot.reports.experiment; import manabot.reports.time_sources; import nbclient; import transformers; import httpx'
          uv run --no-project --python "$RUNNER_TEMP/release-venv/bin/python" python -m manabot.eval.cards --help
          uv run --no-project --python "$RUNNER_TEMP/release-venv/bin/python" python -m manabot.sim.replay --help
          uv run --no-project --python "$RUNNER_TEMP/release-venv/bin/python" python -m manabot.experiment.monitor_worker --help
          uv pip check --python "$RUNNER_TEMP/release-venv/bin/python"
      - name: Exercise latest compatible Torch and Etude in the consumer environment
        shell: bash
        run: |
          uv pip install --python "$RUNNER_TEMP/release-venv/bin/python" --upgrade --torch-backend cpu 'torch>=2.15.0' 'etude-sdk[eval,s3]>=0.2.15'
          uv pip check --python "$RUNNER_TEMP/release-venv/bin/python"
          cd "$RUNNER_TEMP"
          rm -rf release-smoke
          unset PYTHONPATH
          uv run --no-project --python "$RUNNER_TEMP/release-venv/bin/python" smoke.py

  artifacts:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: uv run --no-project python scripts/release/validate.py dist --complete
      - run: uv run --no-project --with twine twine check --strict dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: artifacts
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/manabot
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Validate both packages before either upload
        run: uv run --no-project python scripts/release/validate.py dist --complete
      - name: Check whether these exact artifacts are already published
        id: publication
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --no-project python scripts/release/complete.py dist --tag "$RELEASE_TAG"
      - name: Separate validated package inventories
        run: |
          mkdir engine-dist bot-dist
          cp dist/managym-* engine-dist/
          cp dist/manabot-* bot-dist/
      - name: Publish managym with PyPI attestations
        if: steps.publication.outputs.managym == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: engine-dist/
      - name: Require the complete engine inventory before training upload
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --no-project python scripts/release/complete.py dist --tag "$RELEASE_TAG" --require-engine --wait 300
      - name: Publish manabot with PyPI attestations
        if: steps.publication.outputs.manabot == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bot-dist/

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Require PyPI artifacts and matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --no-project python scripts/release/complete.py dist --tag "$RELEASE_TAG" --github --wait 300
