name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer PR revision replaces its obsolete run. Main and manual runs retain
# independent groups, so publication does not cancel another main verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job-level filters keep the required aggregate present, even for docs-only
  # PRs. Renames select both old and new paths; manual runs exercise all jobs.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      python_unit: ${{ steps.classify.outputs.python_unit }}
      integration: ${{ steps.classify.outputs.integration }}
      academy_integration: ${{ steps.classify.outputs.academy_integration }}
      protocol_v1: ${{ steps.classify.outputs.protocol_v1 }}
      semantic_conformance: ${{ steps.classify.outputs.semantic_conformance }}
      frontend: ${{ steps.classify.outputs.frontend }}
      clean_machine_play: ${{ steps.classify.outputs.clean_machine_play }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            bash .github/ci/select-tests.sh --all | tee -a "$GITHUB_OUTPUT"
          elif [ "$EVENT" = pull_request ]; then
            git diff --no-renames --name-only -z HEAD^1 HEAD | bash .github/ci/select-tests.sh | tee -a "$GITHUB_OUTPUT"
          elif [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            bash .github/ci/select-tests.sh --all | tee -a "$GITHUB_OUTPUT"
          else
            git cat-file -e "$BEFORE^{commit}" || git fetch --no-tags --depth=1 origin "$BEFORE"
            git diff --no-renames --name-only -z "$BEFORE" HEAD | bash .github/ci/select-tests.sh | tee -a "$GITHUB_OUTPUT"
          fi
  rust:
    name: Rust Tests
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # Optimize the engine while keeping debug assertions and overflow
      # checks: opt-level changes neither, and both stay on in the dev and
      # test profiles. It cuts managym's test runtime about 3x.
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            managym -> target

      - name: Rust tests
        working-directory: managym
        run: cargo test

      - name: Preserve regenerated conformance cases
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-conformance-mismatches
          path: target/semantic-conformance/**/*.json
          if-no-files-found: ignore

  python-unit:
    name: Python Unit Tests
    needs: [changes]
    if: needs.changes.outputs.python_unit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev

      - name: Run unit tests
        run: |
          uv run --python 3.12 --extra dev pytest tests/infra/ \
            tests/academy/test_clean_machine_verifier.py deploy/play/tests/

      - name: Website routing tests
        working-directory: website
        run: uv run --python 3.12 --extra test pytest -q

  # PRs and pushes require Linux integration; the same suites run on macOS nightly.
  integration:
    name: Integration
    needs: [changes]
    if: needs.changes.outputs.integration == 'true'
    uses: ./.github/workflows/manabot-integration.yml
    with:
      runner: ubuntu-latest

  academy-integration:
    name: Academy Integration
    needs: [changes]
    if: needs.changes.outputs.academy_integration == 'true'
    uses: ./.github/workflows/academy-integration.yml
    with:
      runner: ubuntu-latest

  protocol-v1:
    name: Protocol v1 Conformance
    needs: [changes]
    if: needs.changes.outputs.protocol_v1 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: academy/ui/package-lock.json

      - name: Install Python dependencies
        run: |
          uv venv .venv --python 3.12
          uv sync --extra dev

      - name: Build Python extension
        run: uv run --python 3.12 --extra play maturin develop --release --manifest-path managym/Cargo.toml --features python

      - name: Certify Rust and Python
        run: |
          cargo test --manifest-path managym/Cargo.toml --test experience_protocol_tests
          uv run --extra dev pytest tests/academy/test_experience_protocol.py -q
          uv run --extra dev pytest tests/academy/test_server.py -k protocol_v1 -q

      - name: Launcher contract tests
        run: uv run --extra dev pytest tests/academy/test_play_launcher.py -q

      - name: Certify TypeScript
        working-directory: academy/ui
        run: |
          npm ci
          npm test -- --run src/lib/protocol-conformance.test.ts
          npm run check

  semantic-conformance:
    name: Semantic Kernel Conformance
    needs: [changes]
    if: needs.changes.outputs.semantic_conformance == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'  # see Rust Tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            managym -> target

      # Rust Tests runs whenever this job does; its semantic_conformance_tests
      # check the replay, property and metamorphic evidence.
      - name: Run bounded valid-action fuzzing
        run: cargo run --locked --manifest-path managym/Cargo.toml --bin semantic_conformance -- fuzz --root conformance/semantic-kernel-w17-v1 --seed 24301 --cases 32 --max-commands 512 --failure-dir target/semantic-conformance/failures

      - name: Preserve exact fuzz replay seeds
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-conformance-failures
          path: target/semantic-conformance/failures/*.json
          if-no-files-found: ignore

  frontend:
    name: Academy UI
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: academy/ui/package-lock.json

      - name: Install Python dependencies
        run: |
          uv venv .venv --python 3.12
          uv export --quiet --frozen --extra dev --no-emit-project \
            --prune torch --prune pandas --prune typer --prune psutil \
            --prune httpx --prune jsonschema --prune ruff \
            --output-file /tmp/visual-requirements.txt
          uv pip install --python .venv/bin/python \
            --requirements /tmp/visual-requirements.txt maturin==1.11.5
          uv pip install --python .venv/bin/python \
            --default-index https://download.pytorch.org/whl/cpu torch==2.10.0

      - name: Build Python extension
        run: uv run --no-sync maturin develop --release --manifest-path managym/Cargo.toml --features python

      - name: Install frontend and Chromium
        working-directory: academy/ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Focused UI checks and browser interactions
        working-directory: academy/ui
        run: |
          npm test
          npm run check
          npm run test:e2e:release

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: academy-browser-failure
          path: academy/ui/test-results/release
          if-no-files-found: warn

  clean-machine-play:
    name: Clean-machine Play
    needs: [changes]
    if: needs.changes.outputs.clean_machine_play == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv and CPython 3.12
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.22'
          python-version: '3.12'
          enable-cache: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Provision proof Chromium
        run: npx --yes playwright@1.61.1 install --with-deps chromium

      - name: Prove clean launch and offline reload
        run: ./scripts/verify-clean-machine

      - name: Report time to playable against the 90-second budget
        run: |
          jq -r '.launch | "Time to playable: \(.elapsed_to_playable_ms) ms of a \(.budget_ms) ms budget"' \
            .cache/clean-machine/proof.json | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$(jq -r .launch.within_budget .cache/clean-machine/proof.json)" != true ]; then
            echo "::warning title=Clean-machine budget::playable after the 90-second budget on this runner"
          fi

      - name: Upload clean-machine receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-machine-play
          path: |
            .cache/clean-machine/proof.json
            .cache/clean-machine/launch.log
          if-no-files-found: warn

  result:
    name: Tests Result
    runs-on: ubuntu-latest
    needs: [changes, rust, python-unit, integration, academy-integration, protocol-v1, semantic-conformance, frontend, clean-machine-play]
    if: always()
    steps:
      - name: Check all jobs
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          SELECTED: ${{ toJSON(needs.changes.outputs) }}
          RESULTS: >-
            rust=${{ needs.rust.result }}
            python-unit=${{ needs.python-unit.result }}
            integration=${{ needs.integration.result }}
            academy-integration=${{ needs.academy-integration.result }}
            protocol-v1=${{ needs.protocol-v1.result }}
            semantic-conformance=${{ needs.semantic-conformance.result }}
            frontend=${{ needs.frontend.result }}
            clean-machine-play=${{ needs.clean-machine-play.result }}
        run: |
          [ "$CHANGES" = success ] || exit 1
          failed=0
          for entry in $RESULTS; do
            job="${entry%%=*}"
            result="${entry#*=}"
            key="${job//-/_}"
            selected=$(jq -er --arg key "$key" '.[$key] | select(. == "true" or . == "false")' <<< "$SELECTED") || exit 1
            echo "$job: $result (selected=$selected)"
            if [ "$selected" = true ]; then
              [ "$result" = success ] || failed=1
            else
              [ "$result" = skipped ] || [ "$result" = success ] || failed=1
            fi
          done
          exit "$failed"
