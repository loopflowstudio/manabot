name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update_visual_references:
        description: Generate reviewed visual references on the pinned Linux profile
        required: false
        default: false
        type: boolean

# A newer PR revision replaces its obsolete run. Main and manual runs retain
# independent groups, so publication does not cancel another main verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests run only the jobs their changed files can affect. Each file
  # is sorted into areas, and each area turns on the jobs that read it:
  #
  #   rust      managym's cargo suites, which include_str! content/,
  #             protocol/ and conformance/ evidence.
  #   manabot   the agent suites (Integration, Semantic Coverage). Their tests
  #             read scripts/, experiments/, ops/, docs/ data and the curated
  #             frontend packs.
  #   academy   the suites that exercise Academy, a client of manabot
  #             (tests/test_package_boundaries.py): Academy Integration and
  #             the play UI gates. A manabot change turns academy on too.
  #   frontend  the play UI gates: protocol conformance, visual references
  #             and clean-machine play.
  #
  # managym/, lockfiles, project manifests, .github/ and any unrecognized path
  # turn on everything. Every change that is not documentation runs Python Unit
  # Tests, which also hold the website routing tests, so a website/ change runs
  # only that job. Markdown that code or tests read (frontend, website,
  # content, conformance, protocol, experiment protocols and data,
  # docs/experiment-metrics.md, docs/benchmarks) counts as code. Pushes to main
  # and manual runs always run everything. "Tests Result" (the required check)
  # accepts a skipped job only when its area was off.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      rust: ${{ steps.classify.outputs.rust }}
      manabot: ${{ steps.classify.outputs.manabot }}
      academy: ${{ steps.classify.outputs.academy }}
      frontend: ${{ steps.classify.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      - name: Classify changed files
        id: classify
        run: |
          emit() {
            for area in docs_only rust manabot academy frontend; do
              echo "$area=${!area}"
              echo "$area=${!area}" >> "$GITHUB_OUTPUT"
            done
          }
          all() { docs_only=false rust=true manabot=true academy=true frontend=true; }
          all
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            emit
            exit 0
          fi
          # HEAD is the PR merge commit; its first parent is the base tip.
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          if [ -z "$files" ]; then
            emit
            exit 0
          fi
          docs_only=true rust=false manabot=false academy=false frontend=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              content/DECKS.md) ;;
              content/*|protocol/*|conformance/*|.github/*) all ;;
              academy/ui/src/lib/packs/*|academy/ui/src/lib/fixtures/*)
                docs_only=false manabot=true academy=true frontend=true ;;
              academy/ui/*) docs_only=false frontend=true ;;
              website/*) docs_only=false ;;
              docs/experiment-metrics.md|docs/benchmarks/*|experiments/*/*)
                docs_only=false manabot=true academy=true ;;
              paper/*|wave/*|scratch/*|.lf/*|LICENSE) ;;
              *.md) ;;
              academy/*|tests/academy/*|deploy/*) docs_only=false academy=true ;;
              manabot/*|tests/*|scripts/*|experiments/*|ops/*|docs/*)
                docs_only=false manabot=true academy=true ;;
              *) all ;;
            esac
          done <<< "$files"
          emit
  rust:
    name: Rust Tests
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # Optimize the engine while keeping debug assertions and overflow
      # checks: opt-level changes neither, and both stay on in the dev and
      # test profiles. It cuts managym's test runtime about 3x.
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            managym -> target

      - name: Rust tests
        working-directory: managym
        run: cargo test

  python-unit:
    name: Python Unit Tests
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev

      - name: Run unit tests
        run: |
          uv run --python 3.12 --extra dev pytest tests/infra/ \
            tests/academy/test_clean_machine_verifier.py deploy/play/tests/

      - name: Website routing tests
        working-directory: website
        run: uv run --python 3.12 --extra test pytest -q

  # PRs and pushes require Linux integration; the same suites run on macOS nightly.
  integration:
    name: Integration
    needs: [changes]
    if: needs.changes.outputs.manabot == 'true'
    uses: ./.github/workflows/manabot-integration.yml
    with:
      runner: ubuntu-latest

  academy-integration:
    name: Academy Integration
    needs: [changes]
    if: needs.changes.outputs.academy == 'true'
    uses: ./.github/workflows/academy-integration.yml
    with:
      runner: ubuntu-latest

  protocol-v1:
    name: Protocol v1 Conformance
    needs: [changes]
    if: needs.changes.outputs.academy == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: academy/ui/package-lock.json

      - name: Install Python dependencies
        run: |
          uv venv .venv --python 3.12
          uv sync --extra dev

      - name: Build Python extension
        run: uv run --python 3.12 --extra play maturin develop --release --manifest-path managym/Cargo.toml --features python

      - name: Certify Rust and Python
        run: |
          cargo test --manifest-path managym/Cargo.toml --test experience_protocol_tests
          uv run --extra dev pytest tests/academy/test_experience_protocol.py -q
          uv run --extra dev pytest tests/academy/test_server.py -k protocol_v1 -q

      - name: Launcher contract tests
        run: uv run --extra dev pytest tests/academy/test_play_launcher.py -q

      - name: Certify TypeScript
        working-directory: academy/ui
        run: |
          npm ci
          npm test -- --run src/lib/protocol-conformance.test.ts
          npm run check

  semantic-coverage:
    name: Semantic Coverage Gate
    needs: [changes]
    if: needs.changes.outputs.manabot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          uv sync --extra dev

      - name: Check semantic coverage evidence
        run: |
          uv run pytest tests/semantic/test_compiler.py tests/semantic/test_coverage_gate.py tests/semantic/test_opcode_alignment.py -q
          uv run scripts/generate_coverage_gaps.py --check
          uv run python scripts/compile_semantic_content.py --check \
            --source content/semantic/v1/elemental_world.source.json \
            --fixtures content/semantic/v1/elemental_world.fixtures.json \
            --ir-output content/semantic/v1/generated/elemental_world.ir.json \
            --coverage-output content/semantic/v1/generated/elemental_world.coverage.json

  semantic-conformance:
    name: Semantic Kernel Conformance
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'  # see Rust Tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            managym -> target

      - name: Check replay, property, and metamorphic evidence
        run: cargo test --locked --manifest-path managym/Cargo.toml --test semantic_conformance_tests

      - name: Reproduce checked conformance artifacts
        run: cargo run --locked --manifest-path managym/Cargo.toml --bin semantic_conformance -- check --root conformance/semantic-kernel-w10-v1

      - name: Run bounded valid-action fuzzing
        run: cargo run --locked --manifest-path managym/Cargo.toml --bin semantic_conformance -- fuzz --root conformance/semantic-kernel-w10-v1 --seed 24301 --cases 32 --max-commands 512 --failure-dir target/semantic-conformance/failures

      - name: Preserve exact fuzz replay seeds
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-conformance-failures
          path: target/semantic-conformance/failures/*.json
          if-no-files-found: ignore

  visual_reference:
    name: Visual Reference Gate
    needs: [changes]
    if: needs.changes.outputs.academy == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: academy/ui/package-lock.json

      - name: Install Python dependencies
        run: |
          uv venv .venv --python 3.12
          uv export --quiet --frozen --extra dev --no-emit-project \
            --prune torch --prune pandas --prune typer --prune psutil \
            --prune httpx --prune jsonschema --prune ruff \
            --output-file /tmp/visual-requirements.txt
          uv pip install --python .venv/bin/python \
            --requirements /tmp/visual-requirements.txt maturin==1.11.5
          uv pip install --python .venv/bin/python \
            --default-index https://download.pytorch.org/whl/cpu torch==2.10.0

      - name: Build Python extension
        run: uv run --no-sync maturin develop --release --manifest-path managym/Cargo.toml --features python

      - name: Install frontend and Chromium
        working-directory: academy/ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Compare committed visual references
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.update_visual_references }}
        run: |
          uv run --no-sync pytest tests/academy/test_release_prompt_matrix.py tests/academy/test_choice_navigation.py -q
          npm --prefix academy/ui run test:e2e:release

      - name: Generate visual reference artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_references }}
        run: |
          npm --prefix academy/ui run test:e2e:release -- --update-snapshots
          uv run --no-sync pytest tests/academy/test_release_prompt_matrix.py tests/academy/test_choice_navigation.py -q
          npm --prefix academy/ui run test:e2e:release

      - name: Upload generated visual references
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_references }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-references-v8
          path: academy/ui/e2e/visual-references/v8
          if-no-files-found: error

      - name: Upload visual failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-reference-failure
          path: academy/ui/test-results/release
          if-no-files-found: warn

  clean-machine-play:
    name: Clean-machine Play
    needs: [changes]
    if: needs.changes.outputs.academy == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv and CPython 3.12
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.22'
          python-version: '3.12'
          enable-cache: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Provision proof Chromium
        run: npx --yes playwright@1.61.1 install --with-deps chromium

      - name: Prove clean launch and offline reload
        run: ./scripts/verify-clean-machine

      - name: Upload clean-machine receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-machine-play
          path: |
            .cache/clean-machine/proof.json
            .cache/clean-machine/launch.log
          if-no-files-found: warn

  result:
    name: Tests Result
    runs-on: ubuntu-latest
    needs: [changes, rust, python-unit, integration, academy-integration, protocol-v1, semantic-coverage, semantic-conformance, visual_reference, clean-machine-play]
    if: always()
    steps:
      - name: Check all jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          RUST: ${{ needs.changes.outputs.rust }}
          MANABOT: ${{ needs.changes.outputs.manabot }}
          ACADEMY: ${{ needs.changes.outputs.academy }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
          RESULTS: >-
            rust=${{ needs.rust.result }}
            python-unit=${{ needs.python-unit.result }}
            integration=${{ needs.integration.result }}
            academy-integration=${{ needs.academy-integration.result }}
            protocol-v1=${{ needs.protocol-v1.result }}
            semantic-coverage=${{ needs.semantic-coverage.result }}
            semantic-conformance=${{ needs.semantic-conformance.result }}
            visual_reference=${{ needs.visual_reference.result }}
            clean-machine-play=${{ needs.clean-machine-play.result }}
        run: |
          echo "changes: $CHANGES docs_only=$DOCS_ONLY rust=$RUST manabot=$MANABOT academy=$ACADEMY frontend=$FRONTEND"
          [ "$CHANGES" = "success" ] || exit 1
          # A missing or misspelled area output must fail, never read as "off".
          for area in "$DOCS_ONLY" "$RUST" "$MANABOT" "$ACADEMY" "$FRONTEND"; do
            [ "$area" = "true" ] || [ "$area" = "false" ] || exit 1
          done
          # The areas that select each job; this mirrors the jobs' if: conditions.
          # A job missing here counts as selected, so it must succeed.
          selected() {
            case "$1" in
              rust|semantic-conformance) [ "$RUST" = "true" ] ;;
              python-unit) [ "$DOCS_ONLY" = "false" ] ;;
              integration|semantic-coverage) [ "$MANABOT" = "true" ] ;;
              academy-integration) [ "$ACADEMY" = "true" ] ;;
              protocol-v1|visual_reference|clean-machine-play)
                [ "$ACADEMY" = "true" ] || [ "$FRONTEND" = "true" ] ;;
              *) return 0 ;;
            esac
          }
          failed=0
          for entry in $RESULTS; do
            job="${entry%%=*}"
            result="${entry#*=}"
            if selected "$job"; then
              echo "$job: $result (selected)"
              [ "$result" = "success" ] || failed=1
            else
              echo "$job: $result (area off)"
              [ "$result" = "skipped" ] || [ "$result" = "success" ] || failed=1
            fi
          done
          exit "$failed"
