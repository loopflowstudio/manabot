name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update_visual_references:
        description: Generate reviewed visual references on the pinned Linux profile
        required: false
        default: false
        type: boolean

jobs:
  # Documentation-only pull requests skip the suites below. Skipped jobs report
  # as skipped, and "Tests Result" (the required check) accepts that only when
  # this job classified the change as documentation. Pushes to main and manual
  # runs always run everything. Markdown that code or tests read (frontend,
  # website, content, conformance, protocol, experiment protocols and data,
  # docs/experiment-metrics.md, docs/benchmarks) counts as code.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      - name: Classify changed files
        id: classify
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the PR merge commit; its first parent is the base tip.
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          docs_only=true
          [ -n "$files" ] || docs_only=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              content/DECKS.md) ;;
              frontend/*|website/*|content/*|conformance/*|protocol/*|.github/*) docs_only=false ;;
              docs/experiment-metrics.md|docs/benchmarks/*) docs_only=false ;;
              experiments/*/*) docs_only=false ;;
              paper/*|wave/*|scratch/*|.lf/*|LICENSE) ;;
              *.md) ;;
              *) docs_only=false ;;
            esac
          done <<< "$files"
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
  rust:
    name: Rust Tests
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            managym -> target

      - name: Rust tests
        working-directory: managym
        run: cargo test

  python-unit:
    name: Python Unit Tests
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev

      - name: Run unit tests
        run: |
          uv run --python 3.12 --extra dev pytest tests/infra/ \
            tests/academy/test_clean_machine_verifier.py deploy/play/tests/

      - name: Website routing tests
        working-directory: website
        run: uv run --python 3.12 --extra test pytest -q

  integration:
    name: Integration (${{ matrix.os }})
    needs: [changes, rust]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            managym -> target

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'managym/pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev --extra play

      - name: Build managym extension
        run: uv run --python 3.12 --extra play maturin develop --features python --manifest-path managym/Cargo.toml

      - name: Setup Node for offline report tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Integration tests
        run: |
          uv run --python 3.12 --extra dev --extra notebook --extra artifacts --extra reports pytest tests/env/ tests/agent/ tests/model/ tests/remote/ \
            tests/sim/test_structured_policy.py \
            tests/verify/test_checkpoint_scenarios.py tests/training/test_scenario_validation.py \
            tests/arena/test_mirror_admission.py tests/training/test_matchups.py \
            tests/training/test_mirror_long.py tests/training/test_local_service.py \
            tests/training/test_allocation.py tests/training/test_step_cadence.py tests/training/test_learning_state.py \
            tests/training/test_numerical_health.py tests/training/test_ataraxos_gradients.py \
            tests/training/test_ataraxos_regime.py tests/training/test_rl_objectives.py tests/sim/test_net_opponent.py \
            tests/training/test_monitoring.py tests/training/test_monitor_evaluation.py \
            tests/training/test_experiment_report.py tests/training/test_learning_dashboard.py \
            tests/training/test_time_profile.py tests/training/test_time_cohort.py \
            tests/training/test_active_training.py tests/training/test_active_recovery.py \
            tests/training/test_producers.py tests/training/test_inference_preparation.py \
            tests/training/test_basic_profile_study.py tests/training/test_profile_artifacts.py \
            tests/training/test_gpu_job.py tests/training/test_batching_grid.py \
            tests/training/test_process_tree_rss.py \
            tests/training/test_etude_bootstrap_diagnostics.py \
            tests/training/test_etude_worker_diagnostics.py \
            tests/training/test_etude_launch_guard.py \
            tests/training/test_etude_storage_reads.py \
            tests/training/test_etude_prebuilt_client.py \
            tests/training/test_grouped_grid.py tests/training/test_grouped_learning.py \
            tests/training/test_locked_gpu_setup.py \
            tests/training/test_prepared_source.py \
            tests/training/test_source_projection.py tests/training/test_batching_evaluation.py \
            tests/training/test_batching_calibration.py \
            tests/training/test_parallel_commands.py tests/training/test_parallel_evaluation_probe.py \
            tests/training/test_learner_witnesses.py \
            tests/bench/test_native_variants.py tests/bench/test_pipeline_benchmark.py tests/bench/test_worker_scaling.py \
            tests/training/test_checkpoint_queue.py tests/training/test_experiment_runner.py \
            tests/training/test_experiments.py tests/training/test_architecture_recipes.py \
            tests/training/test_technique_screen.py tests/training/test_filter_scope_mini.py tests/training/test_capacity_study.py tests/training/test_depth_screen.py \
            tests/training/test_value_models.py \
            tests/training/test_history_input.py tests/training/test_history_arena.py \
            tests/training/test_history_predecessor.py \
            tests/belief/test_sampling_report.py \
            tests/bench/test_structured_policy_benchmark.py tests/bench/test_distributed_recipe_workloads.py

      - name: Frozen-policy search fixtures
        run: |
          uv run --python 3.12 --extra dev pytest -q \
            tests/sim/test_local_update_sampling.py \
            tests/sim/test_local_update_compound.py

      - name: Enum smoke test
        run: uv run --python 3.12 python -c "import managym; assert int(managym.ZoneEnum.STACK) == 4"

      - name: Training smoke test
        run: |
          uv run --python 3.12 python manabot/model/train.py \
            --set train.total_timesteps=128 \
            --set train.num_envs=2 \
            --set train.num_steps=8 \
            --set train.update_epochs=1 \
            --set train.num_minibatches=1 \
            --set experiment.wandb=false \
            --set experiment.profiler_enabled=false \
            --set agent.attention_on=false

  protocol-v1:
    name: Protocol v1 Conformance
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          uv venv .venv --python 3.12
          uv sync --extra dev

      - name: Build Python extension
        run: uv run --python 3.12 --extra play maturin develop --release --manifest-path managym/Cargo.toml --features python

      - name: Certify Rust and Python
        run: |
          cargo test --manifest-path managym/Cargo.toml --test experience_protocol_tests
          uv run --extra dev pytest tests/academy/test_experience_protocol.py -q
          uv run --extra dev pytest tests/academy/test_server.py -k protocol_v1 -q

      - name: Launcher contract tests
        run: uv run --extra dev pytest tests/academy/test_play_launcher.py -q

      - name: Certify TypeScript
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run src/lib/protocol-conformance.test.ts
          npm run check

  semantic-coverage:
    name: Semantic Coverage Gate
    needs: [changes, rust]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          uv sync --extra dev

      - name: Check semantic coverage evidence
        run: |
          uv run pytest tests/semantic/test_compiler.py tests/semantic/test_coverage_gate.py tests/semantic/test_opcode_alignment.py -q
          uv run scripts/generate_coverage_gaps.py --check

  semantic-conformance:
    name: Semantic Kernel Conformance
    needs: [changes, rust]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            managym -> target

      - name: Check replay, property, and metamorphic evidence
        run: cargo test --locked --manifest-path managym/Cargo.toml --test semantic_conformance_tests

      - name: Reproduce checked conformance artifacts
        run: cargo run --locked --manifest-path managym/Cargo.toml --bin semantic_conformance -- check --root conformance/semantic-kernel-w5-v1

      - name: Run bounded valid-action fuzzing
        run: cargo run --locked --manifest-path managym/Cargo.toml --bin semantic_conformance -- fuzz --root conformance/semantic-kernel-w5-v1 --seed 24301 --cases 32 --max-commands 512 --failure-dir target/semantic-conformance/failures

      - name: Preserve exact fuzz replay seeds
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-conformance-failures
          path: target/semantic-conformance/failures/*.json
          if-no-files-found: ignore

  visual_reference:
    name: Visual Reference Gate
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          uv venv .venv --python 3.12
          uv export --quiet --frozen --extra dev --no-emit-project \
            --prune torch --prune pandas --prune typer --prune psutil \
            --prune httpx --prune jsonschema --prune ruff \
            --output-file /tmp/visual-requirements.txt
          uv pip install --python .venv/bin/python \
            --requirements /tmp/visual-requirements.txt maturin==1.11.5
          uv pip install --python .venv/bin/python \
            --default-index https://download.pytorch.org/whl/cpu torch==2.10.0

      - name: Build Python extension
        run: uv run --no-sync maturin develop --release --manifest-path managym/Cargo.toml --features python

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Compare committed visual references
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.update_visual_references }}
        run: |
          uv run --no-sync pytest tests/academy/test_release_prompt_matrix.py -q
          npm --prefix frontend run test:e2e:release

      - name: Generate visual reference artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_references }}
        run: |
          npm --prefix frontend run test:e2e:release -- --update-snapshots
          uv run --no-sync pytest tests/academy/test_release_prompt_matrix.py -q
          npm --prefix frontend run test:e2e:release

      - name: Upload generated visual references
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_references }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-references-v6
          path: frontend/e2e/visual-references/v6
          if-no-files-found: error

      - name: Upload visual failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-reference-failure
          path: frontend/test-results/release
          if-no-files-found: warn

  clean-machine-play:
    name: Clean-machine Play
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv and CPython 3.12
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.22'
          python-version: '3.12'
          enable-cache: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Provision proof Chromium
        run: npx --yes playwright@1.61.1 install --with-deps chromium

      - name: Prove clean launch and offline reload
        run: ./scripts/verify-clean-machine

      - name: Upload clean-machine receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-machine-play
          path: |
            .cache/clean-machine/proof.json
            .cache/clean-machine/launch.log
          if-no-files-found: warn

  result:
    name: Tests Result
    runs-on: ubuntu-latest
    needs: [changes, rust, python-unit, integration, protocol-v1, semantic-coverage, semantic-conformance, visual_reference, clean-machine-play]
    if: always()
    steps:
      - name: Check all jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          RESULTS: >-
            rust=${{ needs.rust.result }}
            python-unit=${{ needs.python-unit.result }}
            integration=${{ needs.integration.result }}
            protocol-v1=${{ needs.protocol-v1.result }}
            semantic-coverage=${{ needs.semantic-coverage.result }}
            semantic-conformance=${{ needs.semantic-conformance.result }}
            visual_reference=${{ needs.visual_reference.result }}
            clean-machine-play=${{ needs.clean-machine-play.result }}
        run: |
          echo "changes: $CHANGES (docs_only=$DOCS_ONLY)"
          [ "$CHANGES" = "success" ] || exit 1
          failed=0
          for entry in $RESULTS; do
            echo "$entry"
            result="${entry#*=}"
            if [ "$result" = "success" ]; then
              continue
            fi
            if [ "$DOCS_ONLY" = "true" ] && [ "$result" = "skipped" ]; then
              continue
            fi
            failed=1
          done
          exit "$failed"
