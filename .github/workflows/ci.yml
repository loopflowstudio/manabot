name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer PR revision replaces its obsolete run. Main and manual runs retain
# independent groups, so publication does not cancel another main verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job-level filters keep the required aggregate present, even for docs-only
  # PRs. Renames select both old and new paths; manual runs exercise all jobs.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      python_unit: ${{ steps.classify.outputs.python_unit }}
      integration: ${{ steps.classify.outputs.integration }}
      academy_integration: ${{ steps.classify.outputs.academy_integration }}
      protocol_v1: ${{ steps.classify.outputs.protocol_v1 }}
      semantic_coverage: ${{ steps.classify.outputs.semantic_coverage }}
      semantic_conformance: ${{ steps.classify.outputs.semantic_conformance }}
      frontend: ${{ steps.classify.outputs.frontend }}
      clean_machine_play: ${{ steps.classify.outputs.clean_machine_play }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            bash .github/ci/select-tests.sh --all | tee -a "$GITHUB_OUTPUT"
          elif [ "$EVENT" = pull_request ]; then
            git diff --no-renames --name-only -z HEAD^1 HEAD | bash .github/ci/select-tests.sh | tee -a "$GITHUB_OUTPUT"
          elif [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            bash .github/ci/select-tests.sh --all | tee -a "$GITHUB_OUTPUT"
          else
            git cat-file -e "$BEFORE^{commit}" || git fetch --no-tags --depth=1 origin "$BEFORE"
            git diff --no-renames --name-only -z "$BEFORE" HEAD | bash .github/ci/select-tests.sh | tee -a "$GITHUB_OUTPUT"
          fi
  rust:
    name: Rust Tests
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # Optimize the engine while keeping debug assertions and overflow
      # checks: opt-level changes neither, and both stay on in the dev and
      # test profiles. It cuts managym's test runtime about 3x.
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            managym -> target

      - name: Rust tests
        working-directory: managym
        run: cargo test

  python-unit:
    name: Python Unit Tests
    needs: [changes]
    if: needs.changes.outputs.python_unit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev

      - name: Run unit tests
        run: |
          uv run --python 3.12 --extra dev pytest tests/infra/ \
            tests/academy/test_clean_machine_verifier.py deploy/play/tests/

      - name: Website routing tests
        working-directory: website
        run: uv run --python 3.12 --extra test pytest -q

  # PRs and pushes require Linux integration; the same suites run on macOS nightly.
  integration:
    name: Integration
    needs: [changes]
    if: needs.changes.outputs.integration == 'true'
    uses: ./.github/workflows/manabot-integration.yml
    with:
      runner: ubuntu-latest

  academy-integration:
    name: Academy Integration
    needs: [changes]
    if: needs.changes.outputs.academy_integration == 'true'
    uses: ./.github/workflows/academy-integration.yml
    with:
      runner: ubuntu-latest

  protocol-v1:
    name: Protocol v1 Conformance
    needs: [changes]
    if: needs.changes.outputs.protocol_v1 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: academy/ui/package-lock.json

      - name: Install Python dependencies
        run: |
          uv venv .venv --python 3.12
          uv sync --extra dev

      - name: Build Python extension
        run: uv run --python 3.12 --extra play maturin develop --release --manifest-path managym/Cargo.toml --features python

      - name: Certify Rust and Python
        run: |
          cargo test --manifest-path managym/Cargo.toml --test experience_protocol_tests
          uv run --extra dev pytest tests/academy/test_experience_protocol.py -q
          uv run --extra dev pytest tests/academy/test_server.py -k protocol_v1 -q

      - name: Launcher contract tests
        run: uv run --extra dev pytest tests/academy/test_play_launcher.py -q

      - name: Certify TypeScript
        working-directory: academy/ui
        run: |
          npm ci
          npm test -- --run src/lib/protocol-conformance.test.ts
          npm run check

  semantic-coverage:
    name: Semantic Coverage Gate
    needs: [changes]
    if: needs.changes.outputs.semantic_coverage == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          uv sync --extra dev

      - name: Check semantic coverage evidence
        run: |
          uv run pytest tests/semantic/test_compiler.py tests/semantic/test_coverage_gate.py tests/semantic/test_opcode_alignment.py -q
          uv run scripts/generate_coverage_gaps.py --check
          uv run python scripts/compile_semantic_content.py --check \
            --source content/semantic/v1/elemental_world.source.json \
            --fixtures content/semantic/v1/elemental_world.fixtures.json \
            --ir-output content/semantic/v1/generated/elemental_world.ir.json \
            --coverage-output content/semantic/v1/generated/elemental_world.coverage.json
      - name: Check optional payment content
        run: |
          uv run scripts/compile_semantic_content.py --check \
            --source content/semantic/w11/elemental_world.source.json \
            --fixtures content/semantic/w11/elemental_world.fixtures.json \
            --ir-output content/semantic/w11/generated/elemental_world.ir.json \
            --coverage-output content/semantic/w11/generated/elemental_world.coverage.json

  semantic-conformance:
    name: Semantic Kernel Conformance
    needs: [changes]
    if: needs.changes.outputs.semantic_conformance == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'  # see Rust Tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            managym -> target

      - name: Check replay, property, and metamorphic evidence
        run: cargo test --locked --manifest-path managym/Cargo.toml --test semantic_conformance_tests

      - name: Reproduce checked conformance artifacts
        run: cargo run --locked --manifest-path managym/Cargo.toml --bin semantic_conformance -- check --root conformance/semantic-kernel-w12-v1

      - name: Run bounded valid-action fuzzing
        run: cargo run --locked --manifest-path managym/Cargo.toml --bin semantic_conformance -- fuzz --root conformance/semantic-kernel-w12-v1 --seed 24301 --cases 32 --max-commands 512 --failure-dir target/semantic-conformance/failures
