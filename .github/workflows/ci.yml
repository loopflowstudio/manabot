name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update_visual_references:
        description: Generate reviewed visual references on the pinned Linux profile
        required: false
        default: false
        type: boolean

jobs:
  # Pull requests run only the jobs their changed files can affect. Each file
  # is sorted into areas, and each area turns on the jobs that read it:
  #
  #   rust      managym's cargo suites, which include_str! content/,
  #             protocol/ and conformance/ evidence.
  #   manabot   the agent suites (Integration, Semantic Coverage). Their tests
  #             read scripts/, experiments/, ops/, docs/ data and the curated
  #             frontend packs.
  #   academy   the suites that exercise Academy, a client of manabot
  #             (tests/test_package_boundaries.py): Academy Integration and
  #             the play UI gates. A manabot change turns academy on too.
  #   frontend  the play UI gates: protocol conformance, visual references
  #             and clean-machine play.
  #
  # managym/, lockfiles, project manifests, .github/ and any unrecognized path
  # turn on everything. Every change that is not documentation runs Python Unit
  # Tests, which also hold the website routing tests, so a website/ change runs
  # only that job. Markdown that code or tests read (frontend, website,
  # content, conformance, protocol, experiment protocols and data,
  # docs/experiment-metrics.md, docs/benchmarks) counts as code. Pushes to main
  # and manual runs always run everything. "Tests Result" (the required check)
  # accepts a skipped job only when its area was off.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      rust: ${{ steps.classify.outputs.rust }}
      manabot: ${{ steps.classify.outputs.manabot }}
      academy: ${{ steps.classify.outputs.academy }}
      frontend: ${{ steps.classify.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      - name: Classify changed files
        id: classify
        run: |
          emit() {
            for area in docs_only rust manabot academy frontend; do
              echo "$area=${!area}"
              echo "$area=${!area}" >> "$GITHUB_OUTPUT"
            done
          }
          all() { docs_only=false rust=true manabot=true academy=true frontend=true; }
          all
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            emit
            exit 0
          fi
          # HEAD is the PR merge commit; its first parent is the base tip.
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          if [ -z "$files" ]; then
            emit
            exit 0
          fi
          docs_only=true rust=false manabot=false academy=false frontend=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              content/DECKS.md) ;;
              content/*|protocol/*|conformance/*|.github/*) all ;;
              frontend/src/lib/packs/*|frontend/src/lib/fixtures/*)
                docs_only=false manabot=true academy=true frontend=true ;;
              frontend/*) docs_only=false frontend=true ;;
              website/*) docs_only=false ;;
              docs/experiment-metrics.md|docs/benchmarks/*|experiments/*/*)
                docs_only=false manabot=true academy=true ;;
              paper/*|wave/*|scratch/*|.lf/*|LICENSE) ;;
              *.md) ;;
              academy/*|tests/academy/*|deploy/*) docs_only=false academy=true ;;
              manabot/*|tests/*|scripts/*|experiments/*|ops/*|docs/*)
                docs_only=false manabot=true academy=true ;;
              *) all ;;
            esac
          done <<< "$files"
          emit
  rust:
    name: Rust Tests
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # Optimize the engine while keeping debug assertions and overflow
      # checks: opt-level changes neither, and both stay on in the dev and
      # test profiles. It cuts managym's test runtime about 3x.
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            managym -> target

      - name: Rust tests
        working-directory: managym
        run: cargo test

  python-unit:
    name: Python Unit Tests
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev

      - name: Run unit tests
        run: |
          uv run --python 3.12 --extra dev pytest tests/infra/ \
            tests/academy/test_clean_machine_verifier.py deploy/play/tests/

      - name: Website routing tests
        working-directory: website
        run: uv run --python 3.12 --extra test pytest -q

  # Two parallel groups per platform: "long" holds the three slowest modules
  # (about half the suite's runtime), "main" holds everything else.
  integration:
    name: Integration (${{ matrix.os }}, ${{ matrix.group }})
    needs: [changes]
    if: needs.changes.outputs.manabot == 'true'
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'  # see Rust Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        group: [main, long]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            managym -> target

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'managym/pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev --extra play

      - name: Build managym extension
        run: uv run --python 3.12 --extra play maturin develop --features python --manifest-path managym/Cargo.toml

      - name: Setup Node for offline report tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Integration tests
        if: matrix.group == 'main'
        run: |
          uv run --python 3.12 --extra dev --extra notebook --extra artifacts --extra reports pytest tests/env/ tests/agent/ tests/model/ tests/remote/ \
            --ignore=tests/model/test_world.py \
            tests/test_package_boundaries.py \
            tests/sim/test_structured_policy.py \
            tests/verify/test_checkpoint_scenarios.py tests/training/test_scenario_validation.py \
            tests/arena/test_models.py tests/arena/test_mirror_admission.py tests/training/test_matchups.py \
            tests/training/test_mirror_long.py tests/training/test_local_service.py \
            tests/training/test_allocation.py tests/training/test_step_cadence.py tests/training/test_learning_state.py \
            tests/training/test_numerical_health.py tests/training/test_ataraxos_gradients.py \
            tests/training/test_ataraxos_regime.py tests/training/test_rl_objectives.py tests/sim/test_net_opponent.py \
            tests/training/test_monitoring.py \
            tests/training/test_experiment_report.py tests/training/test_learning_dashboard.py \
            tests/training/test_time_profile.py tests/training/test_time_cohort.py \
            tests/training/test_active_training.py tests/training/test_active_recovery.py \
            tests/training/test_producers.py tests/training/test_inference_preparation.py \
            tests/training/test_basic_profile_study.py tests/training/test_profile_artifacts.py \
            tests/training/test_gpu_job.py tests/training/test_batching_grid.py \
            tests/training/test_process_tree_rss.py \
            tests/training/test_etude_bootstrap_diagnostics.py \
            tests/training/test_etude_worker_diagnostics.py \
            tests/training/test_etude_launch_guard.py \
            tests/training/test_etude_storage_reads.py \
            tests/training/test_etude_prebuilt_client.py \
            tests/training/test_grouped_grid.py tests/training/test_grouped_learning.py \
            tests/training/test_locked_gpu_setup.py \
            tests/training/test_prepared_source.py \
            tests/training/test_source_projection.py tests/training/test_batching_evaluation.py \
            tests/training/test_batching_calibration.py \
            tests/training/test_parallel_commands.py tests/training/test_parallel_evaluation_probe.py \
            tests/training/test_learner_witnesses.py \
            tests/bench/test_native_variants.py tests/bench/test_pipeline_benchmark.py tests/bench/test_worker_scaling.py \
            tests/training/test_checkpoint_queue.py \
            tests/training/test_experiments.py tests/training/test_architecture_recipes.py \
            tests/training/test_technique_screen.py tests/training/test_filter_scope_mini.py tests/training/test_capacity_study.py tests/training/test_depth_screen.py \
            tests/training/test_value_models.py \
            tests/training/test_history_input.py \
            tests/training/test_history_predecessor.py \
            tests/belief/test_sampling_report.py \
            tests/bench/test_structured_policy_benchmark.py tests/bench/test_distributed_recipe_workloads.py

      - name: Long integration tests
        if: matrix.group == 'long'
        run: |
          uv run --python 3.12 --extra dev --extra notebook --extra artifacts --extra reports pytest \
            tests/training/test_experiment_runner.py \
            tests/training/test_monitor_evaluation.py \
            tests/training/test_history_arena.py

      - name: Enum smoke test
        if: matrix.group == 'main'
        run: uv run --python 3.12 python -c "import managym; assert int(managym.ZoneEnum.STACK) == 4"

      - name: Training smoke test
        if: matrix.group == 'main'
        run: |
          uv run --python 3.12 python manabot/model/train.py \
            --set train.total_timesteps=128 \
            --set train.num_envs=2 \
            --set train.num_steps=8 \
            --set train.update_epochs=1 \
            --set train.num_minibatches=1 \
            --set experiment.wandb=false \
            --set experiment.profiler_enabled=false \
            --set agent.attention_on=false

  # Tests that exercise Academy on top of manabot: checkpoint villains and
  # local-update advice. They run on both platforms whenever manabot or
  # academy changes, so academy-only changes can skip Integration.
  academy-integration:
    name: Academy Integration (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.academy == 'true'
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'  # see Rust Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            managym -> target

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'managym/pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev --extra play

      - name: Build managym extension
        run: uv run --python 3.12 --extra play maturin develop --features python --manifest-path managym/Cargo.toml

      - name: Checkpoint world bindings
        run: uv run --python 3.12 --extra dev --extra notebook --extra artifacts --extra reports pytest tests/model/test_world.py

      - name: Frozen-policy search fixtures
        run: |
          uv run --python 3.12 --extra dev pytest -q \
            tests/sim/test_local_update_sampling.py \
            tests/sim/test_local_update_compound.py

  protocol-v1:
    name: Protocol v1 Conformance
    needs: [changes]
    if: needs.changes.outputs.academy == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          uv venv .venv --python 3.12
          uv sync --extra dev

      - name: Build Python extension
        run: uv run --python 3.12 --extra play maturin develop --release --manifest-path managym/Cargo.toml --features python

      - name: Certify Rust and Python
        run: |
          cargo test --manifest-path managym/Cargo.toml --test experience_protocol_tests
          uv run --extra dev pytest tests/academy/test_experience_protocol.py -q
          uv run --extra dev pytest tests/academy/test_server.py -k protocol_v1 -q

      - name: Launcher contract tests
        run: uv run --extra dev pytest tests/academy/test_play_launcher.py -q

      - name: Certify TypeScript
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run src/lib/protocol-conformance.test.ts
          npm run check

  semantic-coverage:
    name: Semantic Coverage Gate
    needs: [changes]
    if: needs.changes.outputs.manabot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          uv sync --extra dev

      - name: Check semantic coverage evidence
        run: |
          uv run pytest tests/semantic/test_compiler.py tests/semantic/test_coverage_gate.py tests/semantic/test_opcode_alignment.py -q
          uv run scripts/generate_coverage_gaps.py --check

  semantic-conformance:
    name: Semantic Kernel Conformance
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'  # see Rust Tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            managym -> target

      - name: Check replay, property, and metamorphic evidence
        run: cargo test --locked --manifest-path managym/Cargo.toml --test semantic_conformance_tests

      - name: Reproduce checked conformance artifacts
        run: cargo run --locked --manifest-path managym/Cargo.toml --bin semantic_conformance -- check --root conformance/semantic-kernel-w9-v1

      - name: Run bounded valid-action fuzzing
        run: cargo run --locked --manifest-path managym/Cargo.toml --bin semantic_conformance -- fuzz --root conformance/semantic-kernel-w9-v1 --seed 24301 --cases 32 --max-commands 512 --failure-dir target/semantic-conformance/failures
