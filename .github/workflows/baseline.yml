name: Nightly baseline learning

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      steps:
        description: Baseline iterations (empty uses the shared recipe default)
        default: ''

permissions:
  contents: read

concurrency:
  group: baseline-nightly
  cancel-in-progress: false

jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        seed: [197, 281, 419]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: managym -> target
      - name: Install CPU runtime
        run: |
          uv sync --frozen --extra dev --extra play --no-default-groups --group play-runtime
          uv run --no-sync maturin develop --release --manifest-path managym/Cargo.toml --features python
      - name: Recipe and evidence contracts
        run: uv run --no-sync pytest tests/training/test_recipe_etude.py tests/verify/test_learning_regression.py -q
      - name: Ordinary baseline training and frozen evaluation
        env:
          BASELINE_STEPS: ${{ inputs.steps || '' }}
          BASELINE_SEED: ${{ matrix.seed }}
        run: |
          timeout --signal=TERM 1800s uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          from manabot.recipes.baseline import BASELINE_STEPS, BaselineConfig, evaluate

          config = BaselineConfig(
              updates=int(os.environ["BASELINE_STEPS"] or BASELINE_STEPS),
              device="cpu",
          )
          seed = int(os.environ["BASELINE_SEED"])
          os.environ["ETUDE_HOME"] = str(Path(".runs/baseline").resolve())
          subprocess.run([
              "uv", "run", "--no-sync", "etude", "run", "manabot/recipes/baseline.py",
              "--seed", str(seed), "--config", config.model_dump_json(), "--seconds", "1680",
          ], check=True)
          destination = Path(f".runs/baseline/track/baseline/baseline-seed-{seed}/out")
          result = evaluate(config, destination, seed=seed)
          raise SystemExit(result.software != "passed")
          PY
      - name: Summary
        if: always()
        run: |
          report=$(find .runs/baseline -name report.md -print -quit)
          if [ -n "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Baseline did not finish; retained partial evidence is not a learning pass.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-${{ matrix.seed }}
          path: .runs/baseline
          retention-days: 14
          if-no-files-found: error
  evidence:
    if: always() && needs.train.result != 'skipped'
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: managym -> target
      - uses: actions/download-artifact@v4
        with:
          pattern: baseline-*
          path: .runs/cohort
      - name: Install analysis runtime
        run: |
          uv sync --frozen --extra dev --extra play --no-default-groups --group play-runtime
          uv run --no-sync maturin develop --release --manifest-path managym/Cargo.toml --features python
      - name: Paired learning evidence
        run: uv run --no-sync python -m manabot.verify.learning_regression .runs/cohort/baseline-*/learning.json --seeds 197 281 419 --out .runs/result
      - name: Summary
        if: always()
        run: |
          if [ -f .runs/result/report.md ]; then cat .runs/result/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-result
          path: .runs/result
          retention-days: 30
