name: Manabot integration suite

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label selected by PR CI or the macOS nightly
        required: true
        type: string

jobs:
  integration:
    name: Integration (${{ inputs.runner }}, ${{ matrix.group }})
    runs-on: ${{ inputs.runner }}
    # Each group runs on its own runner after the shared install and extension
    # build (~2.5 min); balance groups by measured pytest time so no single
    # group sets the critical path (core ~10 min, evaluation ~9, long ~6).
    strategy:
      fail-fast: false
      matrix:
        group: [core, evaluation, long]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            managym -> target

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev --extra play

      - name: Build managym extension
        run: uv run --python 3.12 --extra play maturin develop --features python --manifest-path managym/Cargo.toml

      - name: Setup Node for offline report tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Integration tests
        if: matrix.group == 'core'
        run: |
          uv run --python 3.12 --extra dev --extra notebook --extra artifacts --extra reports --extra llm pytest --durations=20 tests/env/ tests/agent/ tests/model/ tests/llm/ \
            --ignore=tests/model/test_world.py \
            tests/test_package_boundaries.py \
            tests/semantic/test_text_observation.py tests/semantic/test_decision_contract.py \
            tests/academy/test_trigger_order.py \
            tests/sim/test_structured_policy.py tests/sim/test_guidance.py tests/sim/test_heuristic.py \
            tests/verify/test_checkpoint_scenarios.py tests/verify/test_continuation_input.py tests/training/test_scenario_validation.py \
            tests/verify/test_shared_effect_transport.py tests/verify/test_native_buffer_capacities.py tests/training/test_state_representation_study.py \
            tests/verify/test_observation_parity.py::test_v5_encodes_every_observed_permanent_and_card_field_in_parity \
            tests/verify/test_observation_parity.py::test_versioned_fact_capacity_preserves_provenance_and_rejects_overflow \
            tests/verify/test_observation_parity.py::test_v6_vector_buffers_derive_fact_capacity \
            tests/verify/test_observation_parity.py::test_v5_source_dependent_duration_matches_native_authority \
            tests/training/test_matchups.py tests/training/test_training_decks.py tests/training/test_tla_corpus.py \
            tests/training/test_step_cadence.py tests/training/test_learning_state.py \
            tests/training/test_numerical_health.py tests/training/test_ataraxos_gradients.py \
            tests/training/test_ataraxos_regime.py tests/training/test_rl_objectives.py tests/training/test_collection.py \
            tests/training/test_action_cutoff.py tests/training/test_packed_action_rollouts.py \
            tests/training/test_credit_assignment.py \
            tests/training/test_monitoring.py \
            tests/training/test_experiment_report.py tests/training/test_learning_dashboard.py \
            tests/training/test_time_profile.py tests/training/test_time_cohort.py \
            tests/training/test_active_training.py tests/training/test_active_recovery.py \
            tests/training/test_process_tree_rss.py \
            tests/training/test_precision.py tests/training/test_training_throughput_sizes.py tests/training/test_throughput_c1_readings.py \
            tests/training/test_experiment_data.py \
            tests/training/test_checkpoint_queue.py \
            tests/training/test_experiments.py tests/training/test_builders.py tests/training/test_regimes.py tests/training/test_study.py \
            tests/belief/test_sampling_report.py \
            tests/bench/test_structured_policy_benchmark.py

      - name: Two-seat and Etude evaluation integration
        if: matrix.group == 'evaluation'
        run: |
          uv run --python 3.12 --extra dev --extra artifacts --extra evaluation pytest \
            tests/training/test_two_seat_learning.py tests/training/test_baseline_recipe.py \
            tests/training/test_etude_evaluation.py tests/training/test_head_to_head.py \
            tests/training/test_growing_pool_protocol.py tests/training/test_growing_pool_analysis.py tests/training/test_training_exposure.py \
            tests/eval/ -q

      - name: Evaluation Perf report proof
        if: matrix.group == 'evaluation'
        run: |
          npm --prefix academy/ui ci --ignore-scripts
          npm --prefix academy/ui exec -- playwright install --with-deps chromium
          ./scripts/verify-eval-performance-report

      - name: Enum smoke test
        if: matrix.group == 'evaluation'
        run: uv run --python 3.12 python -c "import managym; assert int(managym.ZoneEnum.STACK) == 4"

      - name: Training smoke test
        if: matrix.group == 'evaluation'
        run: |
          uv run --python 3.12 manabot train --out .runs/ci-local-smoke

      - name: Long integration tests
        if: matrix.group == 'long'
        run: |
          uv run --python 3.12 --extra dev --extra notebook --extra artifacts --extra reports pytest --durations=20 \
            tests/training/test_experiment_runner.py \
            tests/training/test_monitor_evaluation.py \
            tests/training/test_batch_closure.py tests/training/test_credit_assignment.py \
            tests/training/test_frozen_opponent.py tests/training/test_rl_runtime.py \
            tests/training/test_recovery.py tests/training/test_elemental_uniform.py
