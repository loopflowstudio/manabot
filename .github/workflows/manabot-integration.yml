name: Manabot integration suite

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label selected by PR CI or the macOS nightly
        required: true
        type: string

env:
  ACADEMY_CARD_ART: "off"

jobs:
  integration:
    name: Integration (${{ inputs.runner }}, ${{ matrix.group }})
    runs-on: ${{ inputs.runner }}
    # Balance groups for an 8-minute job budget, including install and build
    # (docs/development.md, Job time). Include new tests by file or directory.
    strategy:
      fail-fast: false
      matrix:
        group: [model, sim, training, experiment, evaluation, evaluation-long]
    env:
      # Sync dependencies once, then build managym below. Later syncs would
      # rebuild the engine.
      UV_NO_SYNC: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            managym -> target

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          uv sync --python 3.13 --no-install-package managym \
            --no-default-groups --group play-runtime \
            --extra dev --extra play --extra artifacts \
            --extra reports --extra llm --extra evaluation

      - name: Build managym extension
        run: uv run maturin develop --features python --manifest-path managym/Cargo.toml

      - name: Setup Node for offline report tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Environment and model tests
        if: matrix.group == 'model'
        run: |
          uv run pytest -n logical --durations=20 \
            tests/env/ tests/agent/ tests/model/ tests/llm/ tests/bench/ tests/config/ \
            --ignore=tests/model/test_world.py \
            tests/test_package_boundaries.py tests/test_public_api_contract.py \
            tests/academy/test_trigger_order.py tests/academy/test_qwen_policy.py

      - name: Simulation, belief and semantic tests
        if: matrix.group == 'sim'
        run: |
          uv run pytest -n logical --durations=20 \
            tests/sim/ tests/belief/ tests/semantic/ \
            --ignore=tests/semantic/test_elemental_world.py \
            --ignore=tests/semantic/test_decklist_import.py

      - name: Training tests
        if: matrix.group == 'training'
        run: |
          uv run pytest -n logical --durations=20 \
            tests/training/ tests/infra/test_external_consumer.py \
            --ignore=tests/training/test_cross_backend_continuation.py \
            --ignore=tests/training/test_monitor_evaluation.py \
            --ignore=tests/training/test_game_errors.py \
            --ignore=tests/training/test_training_game_journals.py \
            --ignore=tests/training/test_automatic_game_capture.py \
            --ignore=tests/training/test_two_seat_learning.py \
            --ignore=tests/training/test_adaptive_sampler.py \
            --ignore=tests/training/test_adaptive_two_seat.py \
            --ignore=tests/training/test_etude_evaluation.py \
            --ignore=tests/training/test_head_to_head.py \
            --ignore=tests/training/test_elemental_uniform.py
          uv run pytest -q tests/training/test_cross_backend_continuation.py

      - name: Experiment runner, monitoring and verification tests
        if: matrix.group == 'experiment'
        run: |
          uv run pytest -n logical --durations=20 \
            tests/verify/ \
            --ignore=tests/verify/test_learning_regression.py \
            tests/training/test_monitor_evaluation.py \
            tests/training/test_game_errors.py \
            tests/training/test_training_game_journals.py \
            tests/training/test_automatic_game_capture.py

      - name: Two-seat, Elemental and Etude evaluation integration
        if: matrix.group == 'evaluation'
        run: |
          uv run pytest -n logical --durations=20 \
            tests/training/test_two_seat_learning.py \
            tests/training/test_adaptive_sampler.py tests/training/test_adaptive_two_seat.py \
            tests/training/test_etude_evaluation.py tests/training/test_head_to_head.py \
            tests/training/test_elemental_uniform.py \
            tests/eval/ -q \
            --ignore=tests/eval/test_card_evaluation.py \
            --ignore=tests/eval/test_authored_matchup.py

      - name: Long evaluation matches
        if: matrix.group == 'evaluation-long'
        run: |
          uv run pytest -n logical --durations=20 \
            tests/eval/test_card_evaluation.py tests/eval/test_authored_matchup.py

      - name: Evaluation Perf report proof
        if: matrix.group == 'evaluation'
        run: |
          npm --prefix academy/ui ci --ignore-scripts
          npm --prefix academy/ui exec -- playwright install --with-deps chromium
          ./scripts/verify-eval-performance-report

      - name: Enum smoke test
        if: matrix.group == 'evaluation'
        run: uv run python -c "import managym; assert int(managym.ZoneEnum.STACK) == 4"

      - name: Training smoke test
        if: matrix.group == 'evaluation'
        run: |
          ETUDE_HOME="$PWD/.runs/ci-local-smoke" uv run etude train manabot/recipes/local.py --experiment smoke
