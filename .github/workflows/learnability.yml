name: Learnability

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'manabot/agent/**'
      - 'manabot/env/**'
      - 'manabot/model/**'
      - 'manabot/verify/**'
      - 'manabot/conf/**'
      - 'manabot/infra/**'
      - 'manabot/semantic/**'
      - 'manabot/belief/**'
      - 'manabot/arena/**'
      - 'manabot/sim/player.py'
      - 'manabot/sim/structured_policy.py'
      - 'managym/**'
      - 'manabot/managym/**'
      - 'content/**'
      - 'tests/model/**'
      - 'tests/verify/**'
      - 'experiments/runners/learnability_search.py'
      - 'experiments/runners/learnability_input_audit.py'
      - 'tests/training/test_exploiter_positive_control.py'
      - 'tests/training/test_baseline_recipe.py'
      - '.github/workflows/learnability.yml'
      - 'uv.lock'
      - 'pyproject.toml'

permissions:
  contents: read

concurrency:
  group: learnability-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: managym -> target
      - name: Install CPU dependencies and build native runtime
        run: |
          started=$SECONDS
          uv sync --frozen --extra dev --extra play --no-default-groups --group play-runtime
          uv run --no-sync maturin develop --release --manifest-path managym/Cargo.toml --features python
          mkdir -p .runs/learnability
          echo "Setup/build: $((SECONDS-started)) seconds" > .runs/learnability/setup.txt
      - name: Native ability resolution (debug)
        run: cargo test --locked --manifest-path managym/Cargo.toml --test rules_tests cr_602_policy_preserves_ability_index_and_resolution
      - name: Choice separability and reporting contracts
        run: uv run --no-sync pytest tests/model/test_choice_separability.py tests/verify/test_learnability.py tests/verify/test_learnability_search.py -q
      - name: Shared model diagnostic
        run: uv run --no-sync python -m manabot.verify.learnability --out .runs/learnability/run
      - name: Preserve failure visibility and summary
        if: always()
        run: |
          mkdir -p .runs/learnability/run
          if [ ! -f .runs/learnability/run/result.json ]; then
            jq -n --arg source "$GITHUB_SHA" --arg started "$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" \
              '{status:"error", source:$source, source_digest:"unavailable: preflight failed", config:{}, platform:"GitHub ubuntu-latest", started_at:$started, errors:["Setup/preflight check failed before diagnostic; see Actions logs."]}' \
              > .runs/learnability/run/result.json
            echo '# manabot learnability: setup/preflight check failed' > .runs/learnability/run/report.md
          fi
          cat .runs/learnability/run/report.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f .runs/learnability/setup.txt ]; then cat .runs/learnability/setup.txt >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learnability-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runs/learnability
          retention-days: 30
          if-no-files-found: error
