name: Academy integration suite

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label selected by PR CI or the macOS nightly
        required: true
        type: string

jobs:
  academy-integration:
    name: Academy Integration (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    env:
      # Install dependencies installs every extra once and leaves managym to
      # the extension build; a later sync would compile the engine again.
      UV_NO_SYNC: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            managym -> target

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          uv sync --python 3.13 --no-install-package managym \
            --extra dev --extra play --extra notebook --extra artifacts --extra reports

      - name: Build managym extension
        run: uv run maturin develop --features python --manifest-path managym/Cargo.toml

      - name: Checkpoint world bindings
        run: uv run pytest tests/model/test_world.py

      - name: Elemental roster admission
        run: uv run pytest tests/semantic/test_elemental_world.py tests/semantic/test_decklist_import.py tests/academy/test_decklist_setup.py -q

      - name: Elemental local play contracts
        run: |
          uv run pytest -q \
            tests/academy/test_elemental_play_launcher.py \
            tests/academy/test_named_search_recovery.py \
            tests/academy/test_schedule_recovery.py \
            tests/academy/test_forced_step_automation.py

      - name: Frozen-policy search fixtures
        run: |
          uv run pytest -q \
            tests/sim/test_local_update_sampling.py
