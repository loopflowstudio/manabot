name: Academy integration suite

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label selected by PR CI or the macOS nightly
        required: true
        type: string

env:
  ACADEMY_CARD_ART: "off"

jobs:
  academy-integration:
    name: Academy Integration (${{ inputs.runner }}, ${{ matrix.group }})
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        group: [contracts, play]
    env:
      # Sync dependencies once, then build managym below. Later syncs would
      # rebuild the engine.
      UV_NO_SYNC: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            managym -> target

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          uv sync --python 3.13 --no-install-package managym \
            --no-default-groups --group play-runtime \
            --extra dev --extra play --extra artifacts --extra reports

      - name: Build managym extension
        run: uv run maturin develop --features python --manifest-path managym/Cargo.toml

      - name: World bindings, roster admission and replay/study contracts
        if: matrix.group == 'contracts'
        run: |
          uv run pytest -n logical --dist loadscope --durations=20 \
            tests/model/test_world.py \
            tests/semantic/test_elemental_world.py \
            tests/semantic/test_decklist_import.py \
            tests/sim/test_local_update_sampling.py \
            tests/academy/test_authored_match_authority.py \
            tests/academy/test_authored_match_parity.py \
            tests/academy/test_learn_evidence.py \
            tests/academy/test_replay_index.py \
            tests/academy/test_study_branch.py \
            tests/academy/test_study_runtime.py \
            tests/academy/test_choice_navigation.py \
            tests/academy/test_stops.py \
            tests/academy/test_play_modes.py

      - name: Academy play, recovery and session contracts
        if: matrix.group == 'play'
        run: |
          uv run pytest -n logical --dist loadscope --durations=20 \
            tests/academy/ \
            --ignore=tests/academy/test_authored_match_authority.py \
            --ignore=tests/academy/test_authored_match_parity.py \
            --ignore=tests/academy/test_learn_evidence.py \
            --ignore=tests/academy/test_replay_index.py \
            --ignore=tests/academy/test_study_branch.py \
            --ignore=tests/academy/test_study_runtime.py \
            --ignore=tests/academy/test_choice_navigation.py \
            --ignore=tests/academy/test_stops.py \
            --ignore=tests/academy/test_play_modes.py \
            --ignore=tests/academy/test_clean_machine_verifier.py \
            --ignore=tests/academy/test_qwen_policy.py
