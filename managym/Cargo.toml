[package]
name = "managym"
version = "0.2.0"
edition = "2021"

# The engine, with the rules types it is written in (`state/`) and the card
# sets it runs (`cards/`) as sibling crates. The engine reaches the sets only
# through `managym_cards::catalog()`, so `cargo check -p managym-cards` checks
# a card edit against the rules types alone. `cargo test` here covers all three.
[workspace]
members = ["state", "cards"]
default-members = [".", "state", "cards"]

# Agent worktrees build this crate once or twice, then disappear. Keep file and
# line debugging without retaining a full incremental compiler graph per clone.
# opt-level 1 keeps debug assertions and overflow checks (both stay on in dev
# and test) while running the debug suite about 3x faster; `test` inherits it,
# so local `cargo test`, CI and `maturin develop` share one debug engine.
[profile.dev]
opt-level = 1
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false

[lib]
name = "managym"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]
# Opt-in measurement only; ordinary wheels have no allocation-counter overhead.
benchmark = []

[[example]]
name = "bench_observation"
required-features = ["benchmark"]

[[example]]
name = "bench_execution"
required-features = ["benchmark"]

[[example]]
name = "bench_search"
test = true

[[example]]
name = "bench_layers"
required-features = ["benchmark"]
test = true

[dependencies]
managym-cards = { path = "cards" }
managym-state = { path = "state" }
blake3 = "1"
base64 = "0.22"
rand = "0.8"
rand_chacha = "0.3"
pyo3 = { version = "0.22", optional = true, features = ["extension-module"] }
schemars = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
