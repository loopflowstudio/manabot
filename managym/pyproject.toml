[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "managym"
version = "0.2.0"
description = "A Magic: The Gathering environment for reinforcement learning"
authors = [{ name = "Jack Heart", email = "jack@loopflow.studio" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
# managym.experience mirrors the Rust protocol types as Pydantic models.
dependencies = ["pydantic>=2.12.0", "numpy>=1.24.0"]

[tool.maturin]
bindings = "pyo3"
features = ["python"]
module-name = "managym._managym"
python-source = ".."
zip64 = true
exclude = [
  "managym/target/**",
  "managym/.venv/**",
  "managym/__pycache__/**",
  "managym/libmanagym.dylib.dSYM/**",
]
