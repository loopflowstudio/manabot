[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "managym"
version = "0.2.3"
description = "The Magic: The Gathering rules environment for Manabot"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=1.24.0", "pydantic>=2.12.0"]

[project.urls]
Homepage = "https://manabot.gg"
Repository = "https://github.com/loopflowstudio/manabot"

[tool.maturin]
bindings = "pyo3"
features = ["python"]
manifest-path = "Cargo.toml"
module-name = "managym._managym"
python-source = ".."
python-packages = ["managym"]
include = [{ path = "content/semantic/**/*.json", format = "sdist" }]
# Keep src/**/*.rs and Cargo.lock at their original package paths: heuristic
# registrations and manabot runtime provenance hash these installed bytes.
exclude = [
    "**/__pycache__/**", "**/*.pyc", "**/target/**", "**/*.dSYM/**",
    { path = "**/Cargo.toml", format = "wheel" },
    { path = "**/uv.lock", format = "wheel" },
    { path = "**/pyproject.toml", format = "wheel" },
    { path = "**/state/src/**", format = "wheel" },
    { path = "**/cards/src/**", format = "wheel" },
    { path = "**/tests/**", format = "wheel" },
    { path = "**/examples/**", format = "wheel" },
    { path = "**/perf/**", format = "wheel" },
    { path = "**/.config/**", format = "wheel" },
]
