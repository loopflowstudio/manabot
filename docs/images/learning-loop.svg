<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 964 426" width="964" height="426" role="img" aria-labelledby="t d"><title id="t">One training iteration</title><desc id="d">Play, assign credit, filter and update form a loop that discards each batch. Weights feed an EMA, checkpoints and evaluation, which do not feed back into the loss.</desc><style>
:root{--bg:#f7f0e0;--box:#fcf9ee;--muted:#ded0af;--line:#a5926a;--text:#3a3122;--sub:#5f553d;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--red:#973427;--blue:#2f5f7f;--green:#4c6b3a}
@media (prefers-color-scheme:dark){:root{--bg:#221c14;--box:#2f2717;--muted:#423a2b;--line:#625741;--text:#ece4d0;--sub:#b3a88e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--red:#e08a72;--blue:#8fbdd8;--green:#a5c58c}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--text);font-size:13px}
.h{font-family:Georgia,"Times New Roman",serif;font-size:16px;font-weight:700}
.t{font-family:Georgia,"Times New Roman",serif;font-size:19px;font-weight:700}
.s{fill:var(--sub);font-size:12.5px}.r{fill:var(--red)}.b{fill:var(--blue)}.g{fill:var(--green)}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.2}
.ln{stroke:var(--line);stroke-width:1.6;fill:none}.dash{stroke-dasharray:5 4}
.red{stroke:var(--red)}.blue{stroke:var(--blue)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--line)"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--red)"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--blue)"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--line);stroke-width:1.2"/></pattern>
</defs><rect width="964" height="426" rx="8" style="fill:var(--bg)"/><text x="24" y="34" class="t" text-anchor="start">One training iteration</text><text x="24" y="54" class="s" text-anchor="start">Collect a fresh batch, compute its targets once, take one pass over it, then throw it away.</text><rect x="24" y="76" width="214" height="146" rx="6" class="box"/><text x="38" y="102" class="h" text-anchor="start">1  Play</text><text x="38" y="124" class="s" text-anchor="start">Many managym games step</text><text x="38" y="142" class="s" text-anchor="start">in lockstep. One network</text><text x="38" y="160" class="s" text-anchor="start">plays them. Each decision</text><text x="38" y="178" class="s" text-anchor="start">stores its observation,</text><text x="38" y="196" class="s" text-anchor="start">action, probabilities, value.</text><rect x="258" y="76" width="214" height="146" rx="6" class="box"/><text x="272" y="102" class="h" text-anchor="start">2  Assign credit</text><text x="272" y="124" class="s" text-anchor="start">Reward is the game result:</text><text x="272" y="142" class="s" text-anchor="start">+1 win, −1 loss, 0 draw.</text><text x="272" y="160" class="s" text-anchor="start">GAE (λ=.5) gives advantages.</text><text x="272" y="178" class="s" text-anchor="start">λ-returns (λ=.8) give value</text><text x="272" y="196" class="s" text-anchor="start">targets. Both are then fixed.</text><rect x="492" y="76" width="214" height="146" rx="6" class="box"/><text x="506" y="102" class="h" text-anchor="start">3  Filter</text><text x="506" y="124" class="s" text-anchor="start">Keep decisions whose</text><text x="506" y="142" class="s" text-anchor="start">|advantage| is in the top</text><text x="506" y="160" class="s" text-anchor="start">quarter of the batch and at</text><text x="506" y="178" class="s" text-anchor="start">least .01. Ties are kept.</text><text x="506" y="196" class="s" text-anchor="start">Others leave both losses.</text><rect x="726" y="76" width="214" height="146" rx="6" class="box"/><text x="740" y="102" class="h" text-anchor="start">4  Update</text><text x="740" y="124" class="s" text-anchor="start">One pass, in batch order.</text><text x="740" y="142" class="s" text-anchor="start">Clipped ratio + KL to the</text><text x="740" y="160" class="s" text-anchor="start">collecting policy + KL to the</text><text x="740" y="178" class="s" text-anchor="start">magnet + value loss.</text><text x="740" y="196" class="s" text-anchor="start">Adam, grad norm ≤ .267.</text><path d="M238 149.0H256" class="ln " marker-end="url(#a)"/><path d="M472 149.0H490" class="ln " marker-end="url(#a)"/><path d="M706 149.0H724" class="ln " marker-end="url(#a)"/><path d="M833.0 222V258H131.0V225" class="ln red" marker-end="url(#ar)"/><text x="490" y="252" class="r" text-anchor="middle">next iteration plays with the new weights; the batch is discarded</text><rect x="726" y="286" width="214" height="116" rx="6" class="box"/><text x="740" y="312" class="h" text-anchor="start">Weight average</text><text x="740" y="334" class="s" text-anchor="start">EMA of the weights, .999 per</text><text x="740" y="352" class="s" text-anchor="start">iteration. A separate output</text><text x="740" y="370" class="s" text-anchor="start">that evaluation selects</text><text x="740" y="388" class="s" text-anchor="start">explicitly.</text><rect x="492" y="286" width="214" height="116" rx="6" class="box"/><text x="506" y="312" class="h" text-anchor="start">Checkpoints</text><text x="506" y="334" class="s" text-anchor="start">Raw and EMA weights, bound</text><text x="506" y="352" class="s" text-anchor="start">to their world and recorded</text><text x="506" y="370" class="s" text-anchor="start">with hashes and costs.</text><rect x="24" y="286" width="448" height="116" rx="6" class="box"/><text x="38" y="312" class="h" text-anchor="start">Evaluation</text><text x="38" y="334" class="s" text-anchor="start">Checkpoints play fixed opponents and each other on held-out</text><text x="38" y="352" class="s" text-anchor="start">deals, both decks and both seats. Every game is replay-verified.</text><text x="38" y="370" class="s" text-anchor="start">Scores judge training. They never enter the loss, and the</text><text x="38" y="388" class="s" text-anchor="start">final selection rule is last complete raw, never best score.</text><path d="M726 344H708" class="ln " marker-end="url(#a)"/><path d="M492 344H474" class="ln " marker-end="url(#a)"/></svg>
