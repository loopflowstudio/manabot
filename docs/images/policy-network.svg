<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 964 328" width="964" height="328" role="img" aria-labelledby="t d"><title id="t">One decision through the network</title><desc id="d">A viewer-safe observation is embedded as objects, mixed by self-attention, then read by a policy head with legal actions and focus objects, and by a value head through a masked mean.</desc><style>
:root{--bg:#f7f0e0;--box:#fcf9ee;--muted:#ded0af;--line:#a5926a;--text:#3a3122;--sub:#5f553d;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--red:#973427;--blue:#2f5f7f;--green:#4c6b3a}
@media (prefers-color-scheme:dark){:root{--bg:#221c14;--box:#2f2717;--muted:#423a2b;--line:#625741;--text:#ece4d0;--sub:#b3a88e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--red:#e08a72;--blue:#8fbdd8;--green:#a5c58c}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--text);font-size:13px}
.h{font-family:Georgia,"Times New Roman",serif;font-size:16px;font-weight:700}
.t{font-family:Georgia,"Times New Roman",serif;font-size:19px;font-weight:700}
.s{fill:var(--sub);font-size:12.5px}.r{fill:var(--red)}.b{fill:var(--blue)}.g{fill:var(--green)}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.2}
.ln{stroke:var(--line);stroke-width:1.6;fill:none}.dash{stroke-dasharray:5 4}
.red{stroke:var(--red)}.blue{stroke:var(--blue)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--line)"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--red)"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--blue)"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--line);stroke-width:1.2"/></pattern>
</defs><rect width="964" height="328" rx="8" style="fill:var(--bg)"/><text x="24" y="34" class="t" text-anchor="start">One decision through the network</text><text x="24" y="54" class="s" text-anchor="start">One shared encoder, two outputs. The same action head serves every kind of decision.</text><rect x="24" y="76" width="214" height="170" rx="6" class="box"/><text x="38" y="102" class="h" text-anchor="start">Viewer-safe input</text><text x="38" y="124" class="s" text-anchor="start">players, cards, permanents</text><text x="38" y="142" class="s" text-anchor="start">facts and links</text><text x="38" y="160" class="s" text-anchor="start">current continuation</text><text x="38" y="178" class="s" text-anchor="start">shared effects</text><text x="38" y="196" class="s" text-anchor="start">known hand, decklists</text><text x="38" y="214" class="s" text-anchor="start">card rules tokens</text><rect x="258" y="76" width="200" height="170" rx="6" class="box"/><text x="272" y="102" class="h" text-anchor="start">Embed</text><text x="272" y="124" class="s" text-anchor="start">One vector per object.</text><text x="272" y="142" class="s" text-anchor="start">A GRU reads each card&#x27;s</text><text x="272" y="160" class="s" text-anchor="start">rules tokens. Facts and</text><text x="272" y="178" class="s" text-anchor="start">effects add to the objects</text><text x="272" y="196" class="s" text-anchor="start">they belong to.</text><rect x="478" y="76" width="200" height="170" rx="6" class="box"/><text x="492" y="102" class="h" text-anchor="start">Self-attention</text><text x="492" y="124" class="s" text-anchor="start">Objects inform each other.</text><text x="492" y="142" class="s" text-anchor="start">Padding is masked.</text><text x="492" y="160" class="s" text-anchor="start">Actions and value both</text><text x="492" y="178" class="s" text-anchor="start">read from the result.</text><rect x="714" y="76" width="216" height="80" rx="6" class="box"/><text x="728" y="102" class="h" text-anchor="start">Policy</text><text x="728" y="124" class="s" text-anchor="start">Action + focus objects</text><text x="728" y="142" class="s" text-anchor="start">→ one logit per legal action</text><rect x="714" y="166" width="216" height="80" rx="6" class="box"/><text x="728" y="192" class="h" text-anchor="start">Value</text><text x="728" y="214" class="s" text-anchor="start">Masked mean over objects</text><text x="728" y="232" class="s" text-anchor="start">→ scalar or loss/draw/win</text><path d="M238 161H256" class="ln " marker-end="url(#a)"/><path d="M458 161H476" class="ln " marker-end="url(#a)"/><path d="M678 116H712" class="ln " marker-end="url(#a)"/><path d="M678 206H712" class="ln " marker-end="url(#a)"/><rect x="24" y="262" width="654" height="48" rx="6" class="box"/><text x="38" y="291" class="h" text-anchor="start">Legal actions</text><text x="170" y="291" class="s" text-anchor="start">every offered action, with up to two focus objects each</text><path d="M678 286H948V116H932" class="ln " marker-end="url(#a)"/></svg>
