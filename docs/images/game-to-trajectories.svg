<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 964 354" width="964" height="354" role="img" aria-labelledby="t d"><title id="t">One game, two trajectories</title><desc id="d">An interleaved game of decisions by seats A and B, with one forced decision, splits into one row sequence per seat. Seat A&#x27;s last row has reward +1 and seat B&#x27;s has -1; all other rows have reward 0.</desc><style>
:root{--bg:#f7f0e0;--box:#fcf9ee;--muted:#ded0af;--line:#a5926a;--text:#3a3122;--sub:#5f553d;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--red:#973427;--blue:#2f5f7f;--green:#4c6b3a}
@media (prefers-color-scheme:dark){:root{--bg:#221c14;--box:#2f2717;--muted:#423a2b;--line:#625741;--text:#ece4d0;--sub:#b3a88e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--red:#e08a72;--blue:#8fbdd8;--green:#a5c58c}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--text);font-size:13px}
.h{font-family:Georgia,"Times New Roman",serif;font-size:16px;font-weight:700}
.t{font-family:Georgia,"Times New Roman",serif;font-size:19px;font-weight:700}
.s{fill:var(--sub);font-size:12.5px}.r{fill:var(--red)}.b{fill:var(--blue)}.g{fill:var(--green)}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.2}
.ln{stroke:var(--line);stroke-width:1.6;fill:none}.dash{stroke-dasharray:5 4}
.red{stroke:var(--red)}.blue{stroke:var(--blue)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--line)"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--red)"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--blue)"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--line);stroke-width:1.2"/></pattern>
</defs><rect width="964" height="354" rx="8" style="fill:var(--bg)"/><text x="24" y="34" class="t" text-anchor="start">One game, two trajectories</text><text x="24" y="54" class="s" text-anchor="start">Each seat&#x27;s rows link to that seat&#x27;s next decision, however many opponent decisions fall between them.</text><text x="24" y="105" class="h" text-anchor="start">the game</text><text x="24" y="191" class="h" text-anchor="start">seat A rows</text><text x="24" y="271" class="h" text-anchor="start">seat B rows</text><path d="M164 100H836" class="ln" marker-end="url(#a)"/><text x="838" y="94" class="" text-anchor="end">A wins</text><circle cx="190" cy="100" r="12" style="fill:var(--blue);stroke:var(--bg);stroke-width:2"/><text x="190" y="104.5" text-anchor="middle" style="fill:var(--bg);font-weight:700">A</text><circle cx="274" cy="100" r="12" style="fill:var(--blue);stroke:var(--bg);stroke-width:2"/><text x="274" y="104.5" text-anchor="middle" style="fill:var(--bg);font-weight:700">A</text><circle cx="358" cy="100" r="12" style="fill:var(--red);stroke:var(--bg);stroke-width:2"/><text x="358" y="104.5" text-anchor="middle" style="fill:var(--bg);font-weight:700">B</text><circle cx="442" cy="100" r="12" style="fill:var(--muted);stroke:var(--bg);stroke-width:2"/><text x="442" y="130" class="s" text-anchor="middle">forced: engine plays it, no row</text><circle cx="526" cy="100" r="12" style="fill:var(--blue);stroke:var(--bg);stroke-width:2"/><text x="526" y="104.5" text-anchor="middle" style="fill:var(--bg);font-weight:700">A</text><circle cx="610" cy="100" r="12" style="fill:var(--red);stroke:var(--bg);stroke-width:2"/><text x="610" y="104.5" text-anchor="middle" style="fill:var(--bg);font-weight:700">B</text><circle cx="694" cy="100" r="12" style="fill:var(--red);stroke:var(--bg);stroke-width:2"/><text x="694" y="104.5" text-anchor="middle" style="fill:var(--bg);font-weight:700">B</text><circle cx="778" cy="100" r="12" style="fill:var(--blue);stroke:var(--bg);stroke-width:2"/><text x="778" y="104.5" text-anchor="middle" style="fill:var(--bg);font-weight:700">A</text><rect x="162" y="170" width="56" height="32" rx="5" class="box"/><text x="190" y="191" class="s" text-anchor="middle">r = 0</text><path d="M218 186H244" class="ln " marker-end="url(#a)"/><rect x="246" y="170" width="56" height="32" rx="5" class="box"/><text x="274" y="191" class="s" text-anchor="middle">r = 0</text><path d="M302 186H496" class="ln " marker-end="url(#a)"/><rect x="498" y="170" width="56" height="32" rx="5" class="box"/><text x="526" y="191" class="s" text-anchor="middle">r = 0</text><path d="M554 186H748" class="ln " marker-end="url(#a)"/><rect x="750" y="170" width="56" height="32" rx="5" class="box"/><text x="778" y="191" class="h" text-anchor="middle">+1</text><rect x="330" y="250" width="56" height="32" rx="5" class="box"/><text x="358" y="271" class="s" text-anchor="middle">r = 0</text><path d="M386 266H580" class="ln " marker-end="url(#a)"/><rect x="582" y="250" width="56" height="32" rx="5" class="box"/><text x="610" y="271" class="s" text-anchor="middle">r = 0</text><path d="M638 266H664" class="ln " marker-end="url(#a)"/><rect x="666" y="250" width="56" height="32" rx="5" class="box"/><text x="694" y="271" class="h" text-anchor="middle">−1</text><text x="24" y="316" class="s" text-anchor="start">Rewards sit on each seat&#x27;s last row. A row is pending until its seat decides again or the game ends. GAE walks each row of boxes</text><text x="24" y="334" class="s" text-anchor="start">from right to left and stops at the first box, so seat A&#x27;s credit never mixes with seat B&#x27;s.</text></svg>
