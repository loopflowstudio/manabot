<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 964 466" width="964" height="466" role="img" aria-labelledby="t d"><title id="t">One decision in the engine</title><desc id="d">The engine advances the game until a seat must choose, publishes the legal actions, builds that seat&#x27;s observation, receives a chosen action from outside, executes it and returns to advancing. From any state it can fork an exact clone, replay, or determinize hidden cards.</desc><style>
:root{--bg:#faf8f5;--box:#fffdf9;--muted:#ece6dd;--edge:#c2b5a6;--line:#685f58;--text:#2a2624;--sub:#5f5752;--head:#722f37;--red:#722f37;--blue:#24579e;--green:#31633e;--s1:#9b1a4a;--s2:#0ab3cc;--s3:#685f58}
@media (prefers-color-scheme:dark){:root{--bg:#2b3036;--box:#343b44;--muted:#444e59;--edge:#6b7683;--line:#c7bfb7;--text:#f5f1ea;--sub:#c8c1b8;--head:#cebfa9;--red:#e3b2ae;--blue:#a5c0e1;--green:#a7c5af;--s1:#d4756a;--s2:#0aa6bd;--s3:#c7bfb7}}
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--text);font-size:13px}
.h{font-family:"Instrument Serif",Georgia,serif;font-size:17px;font-weight:400;fill:var(--head)}
.t{font-family:"Instrument Serif",Georgia,serif;font-size:22px;font-weight:400;fill:var(--head)}
.s{fill:var(--sub);font-size:12.5px}.r{fill:var(--red)}.b{fill:var(--blue)}.g{fill:var(--green)}
.box{fill:var(--box);stroke:var(--edge);stroke-width:1.2}
.ln{stroke:var(--line);stroke-width:1.6;fill:none}.dash{stroke-dasharray:5 4}
.red{stroke:var(--red)}.blue{stroke:var(--blue)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--line)"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--red)"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--blue)"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--edge);stroke-width:1.2"/></pattern>
</defs><rect width="964" height="466" rx="8" style="fill:var(--bg)"/><text x="24" y="34" class="t" text-anchor="start">One decision in the engine</text><text x="24" y="54" class="s" text-anchor="start">The engine advances the game until a seat has a real choice, shows that seat what it may see, and executes what comes back.</text><rect x="24" y="80" width="270" height="104" rx="6" class="box"/><text x="38" y="106" class="h" text-anchor="start">1  Advance</text><text x="38" y="128" class="s" text-anchor="start">Turn steps, priority, the stack,</text><text x="38" y="146" class="s" text-anchor="start">state-based actions and triggers</text><text x="38" y="164" class="s" text-anchor="start">run until a player must choose.</text><rect x="347" y="80" width="270" height="104" rx="6" class="box"/><text x="361" y="106" class="h" text-anchor="start">2  Publish</text><text x="361" y="128" class="s" text-anchor="start">The legal actions and who</text><text x="361" y="146" class="s" text-anchor="start">chooses them. One legal action</text><text x="361" y="164" class="s" text-anchor="start">is played here, with no row.</text><rect x="670" y="80" width="270" height="104" rx="6" class="box"/><text x="684" y="106" class="h" text-anchor="start">3  Observe</text><text x="684" y="128" class="s" text-anchor="start">The acting seat&#x27;s view: its hand,</text><text x="684" y="146" class="s" text-anchor="start">the board, the stack, the decision,</text><text x="684" y="164" class="s" text-anchor="start">and nothing hidden from it.</text><rect x="670" y="250" width="270" height="104" rx="6" class="box"/><text x="684" y="276" class="h" text-anchor="start">4  Choose</text><text x="684" y="298" class="s" text-anchor="start">A policy, a search player, a</text><text x="684" y="316" class="s" text-anchor="start">person or a script picks one</text><text x="684" y="334" class="s" text-anchor="start">legal action, outside the engine.</text><rect x="347" y="250" width="270" height="104" rx="6" class="box"/><text x="361" y="276" class="h" text-anchor="start">5  Execute</text><text x="361" y="298" class="s" text-anchor="start">The action is checked again,</text><text x="361" y="316" class="s" text-anchor="start">events are committed, and the</text><text x="361" y="334" class="s" text-anchor="start">game revision advances.</text><path d="M294 132H345" class="ln " marker-end="url(#a)"/><path d="M617 132H668" class="ln " marker-end="url(#a)"/><path d="M805 184V248" class="ln " marker-end="url(#a)"/><path d="M670 302H619" class="ln " marker-end="url(#a)"/><path d="M347 302H159V186" class="ln red" marker-end="url(#ar)"/><text x="250" y="294" class="r" text-anchor="middle">back to 1</text><rect x="24" y="380" width="916" height="62" rx="6" class="box"/><text x="38" y="406" class="h" text-anchor="start">From any state</text><text x="38" y="428" class="s" text-anchor="start">Fork: an exact clone of the game for search.   Replay: the seed and the actions regenerate every state.   Determinize: redraw what this seat cannot see.</text></svg>
