<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 964 258" width="964" height="258" role="img" aria-labelledby="t d"><title id="t">One deal, four games</title><desc id="d">A seeded deal is played four times between two players, swapping decks and seats, and only finished, replay-verified games are scored, with uncertainty from resampling whole deals.</desc><style>
:root{--bg:#faf8f5;--box:#fffdf9;--muted:#ece6dd;--edge:#c2b5a6;--line:#685f58;--text:#2a2624;--sub:#5f5752;--head:#722f37;--red:#722f37;--blue:#24579e;--green:#31633e;--s1:#9b1a4a;--s2:#0ab3cc;--s3:#685f58}
@media (prefers-color-scheme:dark){:root{--bg:#2b3036;--box:#343b44;--muted:#444e59;--edge:#6b7683;--line:#c7bfb7;--text:#f5f1ea;--sub:#c8c1b8;--head:#cebfa9;--red:#e3b2ae;--blue:#a5c0e1;--green:#a7c5af;--s1:#d4756a;--s2:#0aa6bd;--s3:#c7bfb7}}
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--text);font-size:13px}
.h{font-family:"Instrument Serif",Georgia,serif;font-size:17px;font-weight:400;fill:var(--head)}
.t{font-family:"Instrument Serif",Georgia,serif;font-size:22px;font-weight:400;fill:var(--head)}
.s{fill:var(--sub);font-size:12.5px}.r{fill:var(--red)}.b{fill:var(--blue)}.g{fill:var(--green)}
.box{fill:var(--box);stroke:var(--edge);stroke-width:1.2}
.ln{stroke:var(--line);stroke-width:1.6;fill:none}.dash{stroke-dasharray:5 4}
.red{stroke:var(--red)}.blue{stroke:var(--blue)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--line)"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--red)"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--blue)"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--edge);stroke-width:1.2"/></pattern>
</defs><rect width="964" height="258" rx="8" style="fill:var(--bg)"/><text x="24" y="34" class="t" text-anchor="start">One deal, four games</text><text x="24" y="54" class="s" text-anchor="start">A deal is one seeded shuffle. Two players meet on it with both decks and both seats, so deck and seat luck cancel in the comparison.</text><rect x="24" y="84" width="220" height="150" rx="6" class="box"/><text x="38" y="110" class="h" text-anchor="start">Deal 101</text><text x="38" y="132" class="s" text-anchor="start">One seed fixes both</text><text x="38" y="150" class="s" text-anchor="start">libraries and opening</text><text x="38" y="168" class="s" text-anchor="start">hands. Held-out deals</text><text x="38" y="186" class="s" text-anchor="start">never appear in training.</text><rect x="300" y="84" width="330" height="32" rx="5" class="box"/><text x="312" y="105" class="h" text-anchor="start">leg 1</text><text x="366" y="105" class="s" text-anchor="start">A on the play with Lessons · B with Allies</text><path d="M244 159H298" class="ln " marker-end="url(#a)"/><rect x="300" y="124" width="330" height="32" rx="5" class="box"/><text x="312" y="145" class="h" text-anchor="start">leg 2</text><text x="366" y="145" class="s" text-anchor="start">B on the play with Lessons · A with Allies</text><path d="M244 159H298" class="ln " marker-end="url(#a)"/><rect x="300" y="164" width="330" height="32" rx="5" class="box"/><text x="312" y="185" class="h" text-anchor="start">leg 3</text><text x="366" y="185" class="s" text-anchor="start">A on the play with Allies · B with Lessons</text><path d="M244 159H298" class="ln " marker-end="url(#a)"/><rect x="300" y="204" width="330" height="32" rx="5" class="box"/><text x="312" y="225" class="h" text-anchor="start">leg 4</text><text x="366" y="225" class="s" text-anchor="start">B on the play with Allies · A with Lessons</text><path d="M244 159H298" class="ln " marker-end="url(#a)"/><rect x="690" y="84" width="250" height="150" rx="6" class="box"/><text x="704" y="110" class="h" text-anchor="start">Score</text><text x="704" y="132" class="s" text-anchor="start">Only finished, replay-verified</text><text x="704" y="150" class="s" text-anchor="start">games count. Legs of one deal</text><text x="704" y="168" class="s" text-anchor="start">are correlated, so uncertainty</text><text x="704" y="186" class="s" text-anchor="start">resamples whole deals.</text><text x="704" y="204" class="s" text-anchor="start">Mirrors add four more legs.</text><path d="M630 159H688" class="ln " marker-end="url(#a)"/></svg>
