<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 964 402" width="964" height="402" role="img" aria-labelledby="t d"><title id="t">How far the game result reaches</title><desc id="d">Three curves show lambda to the power of decisions before game end. At lambda .5 the weight is near zero by ten decisions, at .8 by about thirty, and at .95 it is still about .13 at forty.</desc><style>
