<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 964 470" width="964" height="470" role="img" aria-labelledby="t d"><title id="t">Where a batch ends</title><desc id="d">Complete-game batches let each stream finish its game and idle until all are done. Exact-quota batches stop every stream at the same decision count, pausing unfinished games and bootstrapping them from a value estimate.</desc><style>
:root{--bg:#f7f0e0;--box:#fcf9ee;--muted:#ded0af;--line:#a5926a;--text:#3a3122;--sub:#5f553d;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--red:#973427;--blue:#2f5f7f;--green:#4c6b3a}
@media (prefers-color-scheme:dark){:root{--bg:#221c14;--box:#2f2717;--muted:#423a2b;--line:#625741;--text:#ece4d0;--sub:#b3a88e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--red:#e08a72;--blue:#8fbdd8;--green:#a5c58c}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--text);font-size:13px}
.h{font-family:Georgia,"Times New Roman",serif;font-size:16px;font-weight:700}
.t{font-family:Georgia,"Times New Roman",serif;font-size:19px;font-weight:700}
.s{fill:var(--sub);font-size:12.5px}.r{fill:var(--red)}.b{fill:var(--blue)}.g{fill:var(--green)}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.2}
.ln{stroke:var(--line);stroke-width:1.6;fill:none}.dash{stroke-dasharray:5 4}
.red{stroke:var(--red)}.blue{stroke:var(--blue)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--line)"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--red)"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--blue)"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--line);stroke-width:1.2"/></pattern>
</defs><rect width="964" height="470" rx="8" style="fill:var(--bg)"/><text x="24" y="34" class="t" text-anchor="start">Where a batch ends</text><text x="24" y="54" class="s">Three of a batch's streams. Bars are games; <tspan class="g">●</tspan> is a real game end with a reward.</text><text x="24" y="92" class="h" text-anchor="start">Complete games</text><text x="190" y="92" class="s" text-anchor="start">two seats (the default), or any run with games_per_stream or a game error policy</text><text x="112" y="122" class="s" text-anchor="start">one batch →</text><text x="24" y="153" class="s" text-anchor="start">stream 0</text><rect x="112" y="138" width="190" height="20" rx="3" style="fill:var(--muted);stroke:var(--line)"/><circle cx="294" cy="148" r="5.5" style="fill:var(--green)"/><rect x="302" y="138" width="290" height="20" rx="3" style="fill:var(--muted);stroke:var(--line)"/><circle cx="584" cy="148" r="5.5" style="fill:var(--green)"/><rect x="595" y="138" width="45" height="20" style="fill:url(#hatch)"/><text x="24" y="185" class="s" text-anchor="start">stream 1</text><rect x="112" y="170" width="450" height="20" rx="3" style="fill:var(--muted);stroke:var(--line)"/><circle cx="554" cy="180" r="5.5" style="fill:var(--green)"/><rect x="565" y="170" width="75" height="20" style="fill:url(#hatch)"/><text x="24" y="217" class="s" text-anchor="start">stream 2</text><rect x="112" y="202" width="170" height="20" rx="3" style="fill:var(--muted);stroke:var(--line)"/><circle cx="274" cy="212" r="5.5" style="fill:var(--green)"/><rect x="282" y="202" width="100" height="20" rx="3" style="fill:var(--muted);stroke:var(--line)"/><circle cx="374" cy="212" r="5.5" style="fill:var(--green)"/><rect x="382" y="202" width="258" height="20" rx="3" style="fill:var(--muted);stroke:var(--line)"/><circle cx="632" cy="212" r="5.5" style="fill:var(--green)"/><rect x="643" y="202" width="-3" height="20" style="fill:url(#hatch)"/><path d="M390 130V230" class="ln dash"/><text x="390" y="246" class="s" text-anchor="middle">decision floor (transitions)</text><path d="M640 130V230" class="ln red"/><text x="640" y="246" class="r" text-anchor="middle">batch closes</text><text x="664" y="148" class="s" text-anchor="start">A stream past the floor plays</text><text x="664" y="166" class="s" text-anchor="start">on to its game end, then idles</text><text x="664" y="184" class="s" text-anchor="start">(hatched). Every trajectory has</text><text x="664" y="202" class="s" text-anchor="start">a real outcome. Nothing is</text><text x="664" y="220" class="s" text-anchor="start">bootstrapped across the batch.</text><path d="M24 266H940" class="ln" style="stroke-width:.7"/><text x="24" y="292" class="h" text-anchor="start">Exact quota</text><text x="190" y="292" class="s" text-anchor="start">one seat, no games_per_stream: the scale ladder v1 control</text><text x="112" y="322" class="s" text-anchor="start">batch k</text><text x="434" y="322" class="s" text-anchor="start">batch k+1</text><text x="24" y="353" class="s" text-anchor="start">stream 0</text><rect x="112" y="338" width="210" height="20" rx="3" style="fill:var(--muted);stroke:var(--line)"/><circle cx="314" cy="348" r="5.5" style="fill:var(--green)"/><rect x="322" y="338" width="300" height="20" rx="3" style="fill:var(--muted);stroke:var(--line)"/><circle cx="614" cy="348" r="5.5" style="fill:var(--green)"/><path d="M420 339l9 9l-9 9l-9-9z" style="fill:var(--red)"/><text x="24" y="385" class="s" text-anchor="start">stream 1</text><rect x="112" y="370" width="370" height="20" rx="3" style="fill:var(--muted);stroke:var(--line)"/><circle cx="474" cy="380" r="5.5" style="fill:var(--green)"/><path d="M420 371l9 9l-9 9l-9-9z" style="fill:var(--red)"/><rect x="482" y="370" width="150" height="20" rx="3" style="fill:var(--muted);stroke:var(--line)"/><circle cx="624" cy="380" r="5.5" style="fill:var(--green)"/><text x="24" y="417" class="s" text-anchor="start">stream 2</text><rect x="112" y="402" width="120" height="20" rx="3" style="fill:var(--muted);stroke:var(--line)"/><circle cx="224" cy="412" r="5.5" style="fill:var(--green)"/><rect x="232" y="402" width="130" height="20" rx="3" style="fill:var(--muted);stroke:var(--line)"/><circle cx="354" cy="412" r="5.5" style="fill:var(--green)"/><rect x="362" y="402" width="275" height="20" rx="3" style="fill:var(--muted);stroke:var(--line)"/><circle cx="629" cy="412" r="5.5" style="fill:var(--green)"/><path d="M420 403l9 9l-9 9l-9-9z" style="fill:var(--red)"/><path d="M420 330V430" class="ln red"/><text x="420" y="446" class="r" text-anchor="middle">every stream reached T learner decisions</text><text x="664" y="348" class="r" text-anchor="start">◆ The game pauses at this seat&#x27;s</text><text x="664" y="366" class="s" text-anchor="start">next decision. V(next_obs) from</text><text x="664" y="384" class="s" text-anchor="start">the collecting weights stands in</text><text x="664" y="402" class="s" text-anchor="start">for the outcome. Batch k+1 samples</text><text x="664" y="420" class="s" text-anchor="start">that decision fresh and finishes</text><text x="664" y="438" class="s" text-anchor="start">the game under new weights.</text></svg>
