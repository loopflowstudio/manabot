<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 964 360" width="964" height="360" role="img" aria-labelledby="t d"><title id="t">Four parts</title><desc id="d">The rules engine sends each seat&#x27;s view to the policy network, which returns a chosen action. Decisions and results go to the learner, which sends new weights to the network. Checkpoints go to evaluation, which never feeds back into training.</desc><style>
:root{--bg:#faf8f5;--box:#fffdf9;--muted:#ece6dd;--edge:#c2b5a6;--line:#685f58;--text:#2a2624;--sub:#5f5752;--head:#722f37;--red:#722f37;--blue:#24579e;--green:#31633e;--s1:#9b1a4a;--s2:#0ab3cc;--s3:#685f58}
@media (prefers-color-scheme:dark){:root{--bg:#2b3036;--box:#343b44;--muted:#444e59;--edge:#6b7683;--line:#c7bfb7;--text:#f5f1ea;--sub:#c8c1b8;--head:#cebfa9;--red:#e3b2ae;--blue:#a5c0e1;--green:#a7c5af;--s1:#d4756a;--s2:#0aa6bd;--s3:#c7bfb7}}
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--text);font-size:13px}
.h{font-family:"Instrument Serif",Georgia,serif;font-size:17px;font-weight:400;fill:var(--head)}
.t{font-family:"Instrument Serif",Georgia,serif;font-size:22px;font-weight:400;fill:var(--head)}
.s{fill:var(--sub);font-size:12.5px}.r{fill:var(--red)}.b{fill:var(--blue)}.g{fill:var(--green)}
.box{fill:var(--box);stroke:var(--edge);stroke-width:1.2}
.ln{stroke:var(--line);stroke-width:1.6;fill:none}.dash{stroke-dasharray:5 4}
.red{stroke:var(--red)}.blue{stroke:var(--blue)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--line)"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--red)"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--blue)"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--edge);stroke-width:1.2"/></pattern>
</defs><rect width="964" height="360" rx="8" style="fill:var(--bg)"/><text x="24" y="34" class="t" text-anchor="start">Four parts</text><text x="24" y="54" class="s" text-anchor="start">The engine runs games, the network plays them, the learner improves the network, and evaluation measures the result from outside the loop.</text><rect x="24" y="80" width="300" height="96" rx="6" class="box"/><text x="38" y="106" class="h" text-anchor="start">Rules engine</text><text x="38" y="128" class="s" text-anchor="start">Runs many games at once and</text><text x="38" y="146" class="s" text-anchor="start">decides what is legal.</text><text x="38" y="164" class="s" text-anchor="start">managym, in Rust.</text><rect x="640" y="80" width="300" height="96" rx="6" class="box"/><text x="654" y="106" class="h" text-anchor="start">Policy network</text><text x="654" y="128" class="s" text-anchor="start">Scores the legal actions and</text><text x="654" y="146" class="s" text-anchor="start">estimates who is winning.</text><text x="654" y="164" class="s" text-anchor="start">manabot.model</text><rect x="24" y="240" width="300" height="96" rx="6" class="box"/><text x="38" y="266" class="h" text-anchor="start">Learner</text><text x="38" y="288" class="s" text-anchor="start">Turns finished games into</text><text x="38" y="306" class="s" text-anchor="start">one weight update per batch.</text><text x="38" y="324" class="s" text-anchor="start">manabot.training</text><rect x="640" y="240" width="300" height="96" rx="6" class="box"/><text x="654" y="266" class="h" text-anchor="start">Evaluation</text><text x="654" y="288" class="s" text-anchor="start">Measures strength on held-out</text><text x="654" y="306" class="s" text-anchor="start">deals. Its scores never enter</text><text x="654" y="324" class="s" text-anchor="start">the loss. manabot.eval</text><path d="M324 104H638" class="ln " marker-end="url(#a)"/><text x="481" y="97" class="b" text-anchor="middle">what the acting seat can see</text><path d="M640 152H326" class="ln " marker-end="url(#a)"/><text x="483" y="170" class="b" text-anchor="middle">chosen action</text><path d="M174 176V238" class="ln " marker-end="url(#a)"/><text x="186" y="212" class="b" text-anchor="start">decisions and results</text><path d="M324 288H480V204H700V178" class="ln " marker-end="url(#a)"/><text x="402" y="281" class="b" text-anchor="middle">new weights</text><path d="M820 176V238" class="ln " marker-end="url(#a)"/><text x="832" y="212" class="b" text-anchor="start">checkpoints</text></svg>
