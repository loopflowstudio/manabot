<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 964 354" width="964" height="354" role="img" aria-labelledby="t d"><title id="t">What the gradient touches</title><desc id="d">Constants from collection enter the policy, damping and value terms. Only the live network&#x27;s logits and value output receive gradients, through a shared encoder.</desc><style>
:root{--bg:#f7f0e0;--box:#fcf9ee;--muted:#ded0af;--line:#a5926a;--text:#3a3122;--sub:#5f553d;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--red:#973427;--blue:#2f5f7f;--green:#4c6b3a}
@media (prefers-color-scheme:dark){:root{--bg:#221c14;--box:#2f2717;--muted:#423a2b;--line:#625741;--text:#ece4d0;--sub:#b3a88e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--red:#e08a72;--blue:#8fbdd8;--green:#a5c58c}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--text);font-size:13px}
.h{font-family:Georgia,"Times New Roman",serif;font-size:16px;font-weight:700}
.t{font-family:Georgia,"Times New Roman",serif;font-size:19px;font-weight:700}
.s{fill:var(--sub);font-size:12.5px}.r{fill:var(--red)}.b{fill:var(--blue)}.g{fill:var(--green)}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.2}
.ln{stroke:var(--line);stroke-width:1.6;fill:none}.dash{stroke-dasharray:5 4}
.red{stroke:var(--red)}.blue{stroke:var(--blue)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--line)"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--red)"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--blue)"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--line);stroke-width:1.2"/></pattern>
</defs><rect width="964" height="354" rx="8" style="fill:var(--bg)"/><text x="24" y="34" class="t" text-anchor="start">What the gradient touches</text><text x="24" y="54" class="s" text-anchor="start">Everything on the left is frozen before the first optimizer step of the iteration.</text><rect x="24" y="76" width="270" height="240" rx="6" class="box"/><text x="38" y="102" class="h" text-anchor="start">Constants from collection</text><text x="38" y="124" class="s" text-anchor="start">behavior log-probabilities</text><text x="38" y="142" class="s" text-anchor="start">collected action</text><text x="38" y="160" class="s" text-anchor="start">advantage  A  (scalar per row)</text><text x="38" y="178" class="s" text-anchor="start">value target  (win/draw/loss mix</text><text x="38" y="196" class="s" text-anchor="start">      or scalar λ-return)</text><text x="38" y="214" class="s" text-anchor="start">magnet: uniform over action types,</text><text x="38" y="232" class="s" text-anchor="start">      then over that type&#x27;s actions</text><text x="38" y="250" class="s" text-anchor="start">τ, learning rate (from the iteration)</text><text x="38" y="268" class="s" text-anchor="start"></text><text x="38" y="286" class="s" text-anchor="start">No gradient reaches these.</text><rect x="690" y="76" width="250" height="240" rx="6" class="box"/><text x="704" y="102" class="h" text-anchor="start">Live network</text><text x="704" y="124" class="s" text-anchor="start">Observation of one decision</text><text x="704" y="142" class="s" text-anchor="start">→ shared encoder and attention</text><text x="704" y="160" class="s" text-anchor="start">→ policy logits over legal actions</text><text x="704" y="178" class="s" text-anchor="start">→ value output</text><text x="704" y="196" class="s" text-anchor="start"></text><text x="704" y="214" class="s" text-anchor="start">Each row is its own forward pass.</text><text x="704" y="232" class="s" text-anchor="start">Nothing backpropagates through</text><text x="704" y="250" class="s" text-anchor="start">game time; the game&#x27;s result</text><text x="704" y="268" class="s" text-anchor="start">arrives only through A and targets.</text><rect x="342" y="100" width="300" height="60" rx="6" class="box"/><text x="356" y="124" class="h" text-anchor="start">Policy term</text><text x="356" y="145" class="s" text-anchor="start">−min(rA, clip(r, .8, 1.2)A)</text><path d="M294 130H340" class="ln " marker-end="url(#a)"/><path d="M688 130H644" class="ln blue" marker-end="url(#ab)"/><rect x="342" y="172" width="300" height="60" rx="6" class="box"/><text x="356" y="196" class="h" text-anchor="start">Damping terms</text><text x="356" y="217" class="s" text-anchor="start">.1·KL(π‖behavior) + τ·KL(π‖magnet)</text><path d="M294 202H340" class="ln " marker-end="url(#a)"/><path d="M688 202H644" class="ln blue" marker-end="url(#ab)"/><rect x="342" y="244" width="300" height="60" rx="6" class="box"/><text x="356" y="268" class="h" text-anchor="start">Value term</text><text x="356" y="289" class="s" text-anchor="start">cross-entropy to the target (or MSE)</text><path d="M294 274H340" class="ln " marker-end="url(#a)"/><path d="M688 274H644" class="ln blue" marker-end="url(#ab)"/><text x="492" y="336" class="b" text-anchor="middle">backward pass: mean over retained rows, policy + value summed, one shared encoder</text></svg>
